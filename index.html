<script>
const Engine = (() => {
  const ALL = ['BTC', 'ETH', 'SOL', 'XRP', 'BNB', 'DOGE', 'SUI', 'ADA', 'TRX', 'LINK'];
  const SYM = /^[A-Z0-9]{2,15}$/;
  const RANKS = [
    null,
    { n: 1, name: '新手', cap: 1000, maxLev: 1, syms: ['BTC', 'ETH'] },
    { n: 2, name: '學徒', cap: 3000, maxLev: 1, syms: ['BTC', 'ETH'] },
    { n: 3, name: '交易員', cap: 10000, maxLev: 1, syms: ALL },
    { n: 4, name: '進階', cap: 30000, maxLev: 3, syms: ALL },
    { n: 5, name: '專業', cap: 100000, maxLev: 10, syms: ALL }
  ];
  const FEE_SPOT = 0.001;
  const FEE_LEV = 0.0005;
  const MMR = 0.005;
  const FUND_8H = 0.0001;
  const MIN_AMOUNT = 10;
  const REASONS = {
    trend: '順著趨勢',
    dip: '跌深反彈',
    breakout: '突破關鍵價',
    support: '支撐或壓力',
    news: '看到消息',
    gut: '憑感覺'
  };

  const fin = (x) => typeof x === 'number' && isFinite(x);
  const pos = (x) => fin(x) && x > 0;

  function newState(now) {
    return {
      v: 1,
      rank: 1,
      cash: 1000,
      positions: [],
      orders: [],
      trades: [],
      lessons: {},
      flags: {},
      rules: null,
      peak: 1000,
      maxDD: 0,
      eqHist: [{ t: now, e: 1000 }],
      nextId: 1,
      rankAt: 0,
      rankLog: [{ t: now, rank: 1 }],
      graduated: false,
      refills: 0,
      lastSeen: now,
      lastPrices: {},
      settings: { twColors: false, ma: false, sym: 'BTC', interval: '1m', amtPct: 0.1, lev: 1, gestured: false, teamPct: 0.25, judge: 'me', statsView: 'all' },
      coinCache: null
    };
  }

  function isLev(p) {
    return p.lev > 1 || p.side === 'short';
  }

  function feeRate(p) {
    return isLev(p) ? FEE_LEV : FEE_SPOT;
  }

  function liqPrice(side, entry, lev) {
    if (side === 'long') {
      if (lev <= 1) return 0;
      return entry * (1 - 1 / lev + MMR);
    }
    return entry * (1 + 1 / lev - MMR);
  }

  function posPnl(p, price) {
    return (price - p.entry) * p.qty * (p.side === 'long' ? 1 : -1);
  }

  function posValue(p, price) {
    return Math.max(0, p.margin + posPnl(p, price));
  }

  function equity(s, prices) {
    let e = s.cash;
    for (const o of s.orders) e += o.reserve;
    for (const p of s.positions) {
      const px = pos(prices[p.sym]) ? prices[p.sym] : p.entry;
      e += posValue(p, px);
    }
    return e;
  }

  function touchDD(s, prices) {
    const e = equity(s, prices);
    if (e > s.peak) s.peak = e;
    if (s.peak > 0) {
      const dd = (s.peak - e) / s.peak;
      if (dd > s.maxDD) s.maxDD = dd;
    }
    return e;
  }

  function validateStops(side, ref, sl, tp, lev) {
    if (sl != null) {
      if (!pos(sl)) return '停損價要是大於 0 的數字';
      if (side === 'long' && sl >= ref) return '買進的停損價要低於進場價';
      if (side === 'short' && sl <= ref) return '做空的停損價要高於進場價';
      const liq = liqPrice(side, ref, lev);
      if (side === 'long' && liq > 0 && sl <= liq) return '停損價比強制平倉價還遠，等於沒設。請設得更靠近進場價';
      if (side === 'short' && sl >= liq) return '停損價比強制平倉價還遠，等於沒設。請設得更靠近進場價';
    }
    if (tp != null) {
      if (!pos(tp)) return '停利價要是大於 0 的數字';
      if (side === 'long' && tp <= ref) return '買進的停利價要高於進場價';
      if (side === 'short' && tp >= ref) return '做空的停利價要低於進場價';
    }
    return null;
  }

  function canShort(s) {
    return s.rank >= 4 || !!(s.lessons[5] && s.lessons[5].done);
  }

  function checkOrderInput(s, o) {
    const r = RANKS[s.rank];
    if (typeof o.sym !== 'string' || !SYM.test(o.sym)) return '幣種不正確';
    if (o.side !== 'long' && o.side !== 'short') return '方向不正確';
    if (o.side === 'short' && !canShort(s)) return '買跌要先通過第 5 關（停損）';
    if (!Number.isInteger(o.lev) || o.lev < 1) return '槓桿倍數不正確';
    if (o.lev > r.maxLev) return '這個槓桿倍數還沒解鎖';
    if (!pos(o.amount)) return '請輸入金額';
    if (o.amount < MIN_AMOUNT) return '最少要下 ' + MIN_AMOUNT + ' USDT';
    if ((o.sl != null || o.tp != null) && s.rank < 2) return '停損停利要到段位 2 才會解鎖';
    if (o.reason != null && !REASONS[o.reason]) return '理由不正確';
    return null;
  }

  function costOf(o) {
    const rate = o.lev > 1 || o.side === 'short' ? FEE_LEV : FEE_SPOT;
    return o.amount + o.amount * o.lev * rate;
  }

  function maxAmount(cash, lev, side) {
    const rate = lev > 1 || side === 'short' ? FEE_LEV : FEE_SPOT;
    return Math.floor((cash / (1 + lev * rate)) * 100) / 100;
  }

  function openPosition(s, o, prices) {
    const err = checkOrderInput(s, o);
    if (err) return { ok: false, err };
    if (!pos(o.price)) return { ok: false, err: '目前沒有報價，請稍後再試' };
    const sl = o.sl == null ? null : o.sl;
    const tp = o.tp == null ? null : o.tp;
    const e2 = validateStops(o.side, o.price, sl, tp, o.lev);
    if (e2) return { ok: false, err: e2 };
    const cost = costOf(o);
    if (cost > s.cash + 1e-9) return { ok: false, err: '可用資金不夠（含手續費需要 ' + cost.toFixed(2) + ' USDT）' };
    const eq0 = equity(s, prices) + (o.fromReserve || 0);
    const notional = o.amount * o.lev;
    const fee = cost - o.amount;
    const qty = notional / o.price;
    s.cash -= cost;
    const p = {
      id: s.nextId++,
      sym: o.sym,
      side: o.side,
      lev: o.lev,
      qty,
      entry: o.price,
      margin: o.amount,
      feeOpen: fee,
      sl,
      tp,
      reason: o.reason || null,
      t0: o.now,
      eq0,
      sizePct: o.amount / eq0,
      riskPct: sl != null ? (Math.abs(o.price - sl) * qty) / eq0 : null,
      hadSL: sl != null,
      liq: liqPrice(o.side, o.price, o.lev),
      r0: sl != null ? Math.abs(o.price - sl) * qty : null,
      ctx: o.ctx || null,
      owner: o.owner === 'team' ? 'team' : 'me',
      afterLoss: o.owner === 'team' ? null : recentLoss(s, o.now)
    };
    if (o.src) p.src = String(o.src).slice(0, 12);
    s.positions.push(p);
    if (p.owner === 'me') markOpenFlags(s, p);
    return { ok: true, pos: p };
  }

  const OWN = (t) => t.owner !== 'team';
  function mine(s) {
    return s.trades.filter(OWN);
  }

  function recentLoss(s, now) {
    const M = mine(s);
    const t = M[M.length - 1];
    if (!t || t.pnl >= 0) return null;
    if (now - t.t1 > 5 * 60000) return null;
    return { sizePct: t.sizePct };
  }

  function markOpenFlags(s, p) {
    s.flags.opened = true;
    if (p.sl != null) s.flags.slSet = true;
    if (p.sl != null && p.tp != null) {
      const rr = Math.abs(p.tp - p.entry) / Math.abs(p.entry - p.sl);
      if (rr >= 1.5 - 1e-9) s.flags.rr = true;
    }
    if (p.riskPct != null && p.riskPct <= 0.02 + 1e-9) s.flags.risk2 = true;
  }

  function setReason(s, id, reason) {
    if (!REASONS[reason]) return { ok: false, err: '理由不正確' };
    const t = s.trades.find((x) => x.id === id);
    if (!t) return { ok: false, err: '找不到這筆交易' };
    t.reason = reason;
    if (reason === 'trend' && t.ctx && t.ctx.above != null && ((t.side === 'long' && t.ctx.above) || (t.side === 'short' && !t.ctx.above))) s.flags.trendTrade = true;
    return { ok: true };
  }

  function modifyOrder(s, id, limit, cur) {
    const o = s.orders.find((x) => x.id === id);
    if (!o) return { ok: false, err: '找不到這張掛單' };
    if (!pos(limit) || !pos(cur)) return { ok: false, err: '價格不正確' };
    if (o.side === 'long' && limit >= cur) return { ok: false, err: '買漲的掛單價要低於現價' };
    if (o.side === 'short' && limit <= cur) return { ok: false, err: '買跌的掛單價要高於現價' };
    if (o.sl != null || o.tp != null) {
      const e2 = validateStops(o.side, limit, o.sl, o.tp, o.lev);
      if (e2) return { ok: false, err: e2 };
    }
    o.limit = limit;
    return { ok: true };
  }

  function createOrder(s, o) {
    const err = checkOrderInput(s, o);
    if (err) return { ok: false, err };
    if (!pos(o.limit)) return { ok: false, err: '請輸入限價' };
    if (!pos(o.cur)) return { ok: false, err: '目前沒有報價，請稍後再試' };
    if (o.side === 'long' && o.limit >= o.cur) return { ok: false, err: '買進的限價要低於現價。想馬上成交請用市價' };
    if (o.side === 'short' && o.limit <= o.cur) return { ok: false, err: '做空的限價要高於現價。想馬上成交請用市價' };
    const sl = o.sl == null ? null : o.sl;
    const tp = o.tp == null ? null : o.tp;
    const e2 = validateStops(o.side, o.limit, sl, tp, o.lev);
    if (e2) return { ok: false, err: e2 };
    const cost = costOf(o);
    if (cost > s.cash + 1e-9) return { ok: false, err: '可用資金不夠（含手續費需要 ' + cost.toFixed(2) + ' USDT）' };
    s.cash -= cost;
    const ord = {
      id: s.nextId++,
      sym: o.sym,
      side: o.side,
      lev: o.lev,
      amount: o.amount,
      limit: o.limit,
      sl,
      tp,
      reason: o.reason || null,
      t: o.now,
      reserve: cost,
      ctx: o.ctx || null,
      owner: o.owner === 'team' ? 'team' : 'me'
    };
    s.orders.push(ord);
    s.flags.limitPlaced = true;
    return { ok: true, order: ord };
  }

  function cancelOrder(s, id) {
    const i = s.orders.findIndex((x) => x.id === id);
    if (i < 0) return { ok: false, err: '找不到這張掛單' };
    s.cash += s.orders[i].reserve;
    s.orders.splice(i, 1);
    return { ok: true };
  }

  function setStops(s, id, sl, tp, price, auto) {
    const p = s.positions.find((x) => x.id === id);
    if (!p) return { ok: false, err: '找不到這筆持倉' };
    if (s.rank < 2 && !(auto && p.owner === 'team')) return { ok: false, err: '停損停利要到段位 2 才會解鎖' };
    if (!pos(price)) return { ok: false, err: '目前沒有報價，請稍後再試' };
    if (sl != null) {
      if (!pos(sl)) return { ok: false, err: '停損價要是大於 0 的數字' };
      if (p.side === 'long' && sl >= price) return { ok: false, err: '停損價要低於現價，不然會馬上觸發' };
      if (p.side === 'short' && sl <= price) return { ok: false, err: '停損價要高於現價，不然會馬上觸發' };
      if (p.side === 'long' && p.liq > 0 && sl <= p.liq) return { ok: false, err: '停損價比強制平倉價還遠，等於沒設' };
      if (p.side === 'short' && sl >= p.liq) return { ok: false, err: '停損價比強制平倉價還遠，等於沒設' };
    }
    if (tp != null) {
      if (!pos(tp)) return { ok: false, err: '停利價要是大於 0 的數字' };
      if (p.side === 'long' && tp <= price) return { ok: false, err: '停利價要高於現價，不然會馬上觸發' };
      if (p.side === 'short' && tp >= price) return { ok: false, err: '停利價要低於現價，不然會馬上觸發' };
    }
    p.sl = sl;
    p.tp = tp;
    if (sl != null) {
      if (p.r0 == null) p.r0 = Math.abs(p.entry - sl) * p.qty;
      if (!auto) p.hadSL = true;
      if (p.riskPct == null || !auto) {
        const adverse = p.side === 'long' ? p.entry - sl : sl - p.entry;
        p.riskPct = Math.max(0, adverse * p.qty) / p.eq0;
      }
    }
    if (auto) p.autoSL = sl != null;
    else if (p.owner !== 'team') markOpenFlags(s, p);
    return { ok: true };
  }

  function closePosition(s, id, price, now, why, prices) {
    const i = s.positions.findIndex((x) => x.id === id);
    if (i < 0) return { ok: false, err: '找不到這筆持倉' };
    if (!pos(price)) return { ok: false, err: '目前沒有報價，請稍後再試' };
    const p = s.positions[i];
    const rate = feeRate(p);
    const gross = posPnl(p, price);
    const hours = Math.max(0, now - p.t0) / 3600000;
    const funding = isLev(p) ? p.qty * p.entry * FUND_8H * (hours / 8) : 0;
    let feeClose = p.qty * price * rate;
    let payout = p.margin + gross - feeClose - funding;
    let reason = why;
    if (why === 'liq' || payout <= 0) {
      payout = 0;
      feeClose = 0;
      if (isLev(p)) reason = 'liq';
    }
    const pnl = payout - p.margin - p.feeOpen;
    s.cash += payout;
    s.positions.splice(i, 1);
    const t = {
      id: p.id,
      sym: p.sym,
      side: p.side,
      lev: p.lev,
      qty: p.qty,
      entry: p.entry,
      exit: price,
      margin: p.margin,
      gross,
      fees: p.feeOpen + feeClose,
      funding,
      pnl,
      ret: pnl / p.eq0,
      pct: pnl / p.margin,
      t0: p.t0,
      t1: now,
      why: reason,
      reason: p.reason,
      hadSL: p.hadSL || !!p.autoSL,
      r: p.r0 > 0 ? pnl / p.r0 : null,
      sl: p.sl,
      tp: p.tp,
      sizePct: p.sizePct,
      riskPct: p.riskPct,
      ctx: p.ctx,
      afterLoss: p.afterLoss,
      rank: s.rank,
      owner: p.owner === 'team' ? 'team' : 'me',
      src: p.src || null
    };
    s.trades.push(t);
    if (s.trades.length > 2000) {
      const cut = s.trades.length - 2000;
      s.trades.splice(0, cut);
      s.rankAt = Math.max(0, s.rankAt - cut);
    }
    s.flags.closed = true;
    const px = Object.assign({}, prices);
    px[p.sym] = price;
    const e = touchDD(s, px);
    s.eqHist.push({ t: now, e });
    if (s.eqHist.length > 400) s.eqHist.splice(0, s.eqHist.length - 400);
    return { ok: true, trade: t };
  }

  function processRange(s, sym, lo, hi, last, now, prices, exact) {
    const events = [];
    for (const o of s.orders.slice()) {
      if (o.sym !== sym) continue;
      const hit = o.side === 'long' ? lo <= o.limit : hi >= o.limit;
      if (!hit) continue;
      s.orders.splice(s.orders.indexOf(o), 1);
      s.cash += o.reserve;
      const saved = s.flags.limitPlaced;
      const r = openPosition(
        s,
        { sym, side: o.side, lev: o.lev, amount: o.amount, price: o.limit, sl: o.sl, tp: o.tp, reason: o.reason, now, ctx: o.ctx, owner: o.owner },
        prices
      );
      s.flags.limitPlaced = saved;
      if (r.ok) {
        r.pos.fresh = true;
        r.pos.fromLimit = true;
        events.push({ type: 'fill', pos: r.pos });
      }
    }
    for (const p of s.positions.slice()) {
      if (p.sym !== sym) continue;
      if (p.fresh) {
        delete p.fresh;
        if (!exact) continue;
      }
      const long = p.side === 'long';
      let px = null;
      let why = null;
      const liqHit = long ? p.liq > 0 && lo <= p.liq : hi >= p.liq;
      const slHit = p.sl != null && (long ? lo <= p.sl : hi >= p.sl);
      const tpHit = p.tp != null && (long ? hi >= p.tp : lo <= p.tp);
      if (slHit) {
        why = 'sl';
        px = exact ? last : p.sl;
      } else if (liqHit) {
        why = 'liq';
        px = p.liq;
      } else if (tpHit) {
        why = 'tp';
        px = p.tp;
      }
      if (!why) continue;
      const r = closePosition(s, p.id, px, now, why, prices);
      if (r.ok) events.push({ type: r.trade.why, trade: r.trade });
    }
    return events;
  }

  function onPrice(s, sym, price, now, prices) {
    if (!pos(price)) return [];
    return processRange(s, sym, price, price, price, now, prices, true);
  }

  function onCandle(s, sym, c, prices) {
    if (!c || !pos(c.l) || !pos(c.h) || c.h < c.l) return [];
    return processRange(s, sym, c.l, c.h, c.c, c.t, prices, false);
  }

  function lgamma(x) {
    const g = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.001208650973866179, -0.000005395239384953];
    let y = x;
    let tmp = x + 5.5;
    tmp -= (x + 0.5) * Math.log(tmp);
    let ser = 1.000000000190015;
    for (let j = 0; j < 6; j++) ser += g[j] / ++y;
    return -tmp + Math.log((2.5066282746310005 * ser) / x);
  }

  function betacf(a, b, x) {
    const FPMIN = 1e-300;
    const qab = a + b;
    const qap = a + 1;
    const qam = a - 1;
    let c = 1;
    let d = 1 - (qab * x) / qap;
    if (Math.abs(d) < FPMIN) d = FPMIN;
    d = 1 / d;
    let h = d;
    for (let m = 1; m <= 200; m++) {
      const m2 = 2 * m;
      let aa = (m * (b - m) * x) / ((qam + m2) * (a + m2));
      d = 1 + aa * d;
      if (Math.abs(d) < FPMIN) d = FPMIN;
      c = 1 + aa / c;
      if (Math.abs(c) < FPMIN) c = FPMIN;
      d = 1 / d;
      h *= d * c;
      aa = (-(a + m) * (qab + m) * x) / ((a + m2) * (qap + m2));
      d = 1 + aa * d;
      if (Math.abs(d) < FPMIN) d = FPMIN;
      c = 1 + aa / c;
      if (Math.abs(c) < FPMIN) c = FPMIN;
      d = 1 / d;
      const del = d * c;
      h *= del;
      if (Math.abs(del - 1) < 3e-12) break;
    }
    return h;
  }

  function ibeta(a, b, x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    const bt = Math.exp(lgamma(a + b) - lgamma(a) - lgamma(b) + a * Math.log(x) + b * Math.log(1 - x));
    if (x < (a + 1) / (a + b + 2)) return (bt * betacf(a, b, x)) / a;
    return 1 - (bt * betacf(b, a, 1 - x)) / b;
  }

  function tcdf(t, df) {
    const x = df / (df + t * t);
    const p = 0.5 * ibeta(df / 2, 0.5, x);
    return t > 0 ? 1 - p : p;
  }

  function statsFor(trades) {
    const n = trades.length;
    const out = { n, wins: 0, losses: 0, winRate: 0, avgWin: 0, avgLoss: 0, exp: 0, pf: null, pnl: 0, conf: null, slRate: 0, payoff: null };
    if (!n) return out;
    let sw = 0;
    let sl = 0;
    let gw = 0;
    let gl = 0;
    let sum = 0;
    let withSL = 0;
    for (const t of trades) {
      sum += t.ret;
      out.pnl += t.pnl;
      if (t.hadSL) withSL++;
      if (t.pnl > 0) {
        out.wins++;
        sw += t.ret;
        gw += t.pnl;
      } else {
        out.losses++;
        sl += t.ret;
        gl += -t.pnl;
      }
    }
    out.winRate = out.wins / n;
    out.avgWin = out.wins ? sw / out.wins : 0;
    out.avgLoss = out.losses ? sl / out.losses : 0;
    out.exp = sum / n;
    out.pf = gl > 0 ? gw / gl : gw > 0 ? Infinity : null;
    out.payoff = out.avgLoss < 0 && out.wins ? out.avgWin / -out.avgLoss : null;
    out.slRate = withSL / n;
    if (n >= 20) {
      let v = 0;
      for (const t of trades) v += (t.ret - out.exp) * (t.ret - out.exp);
      const sd = Math.sqrt(v / (n - 1));
      if (sd > 0) out.conf = tcdf(out.exp / (sd / Math.sqrt(n)), n - 1);
      else out.conf = out.exp > 0 ? 1 : 0;
    }
    return out;
  }

  function curveDD(trades) {
    let e = 1;
    let peak = 1;
    let dd = 0;
    for (const t of trades) {
      e *= 1 + t.ret;
      if (e > peak) peak = e;
      dd = Math.max(dd, (peak - e) / peak);
    }
    return dd;
  }

  function levTrades(s) {
    return mine(s).filter((t) => t.lev > 1 || t.side === 'short');
  }

  function lessonsDone(s, ids) {
    return ids.every((i) => s.lessons[i] && s.lessons[i].done);
  }

  function requirements(s) {
    const T = mine(s);
    const n = T.length;
    const req = [];
    const lessonReq = (ids) => {
      const done = ids.filter((i) => s.lessons[i] && s.lessons[i].done).length;
      req.push({ label: '完成第 ' + ids[0] + '～' + ids[ids.length - 1] + ' 關', done: done === ids.length, prog: done + ' / ' + ids.length });
    };
    if (s.rank === 1) {
      lessonReq([1, 2, 3, 4]);
    } else if (s.rank === 2) {
      lessonReq([5, 6, 7]);
      req.push({ label: '累積 20 筆交易', done: n >= 20, prog: Math.min(n, 20) + ' / 20' });
      const st = statsFor(T.slice(-20));
      req.push({ label: '最近 20 筆有九成設了停損', done: n >= 20 && st.slRate >= 0.9 - 1e-9, prog: n ? Math.round(st.slRate * 100) + '%' : '尚無紀錄' });
    } else if (s.rank === 3) {
      lessonReq([8, 9, 10, 11]);
      req.push({ label: '累積 40 筆交易', done: n >= 40, prog: Math.min(n, 40) + ' / 40' });
      const st = statsFor(T.slice(-40));
      req.push({ label: '最近 40 筆的期望值為正', done: n >= 40 && st.exp > 0, prog: n ? (st.exp >= 0 ? '+' : '') + (st.exp * 100).toFixed(2) + '%' : '尚無紀錄' });
    } else if (s.rank === 4) {
      req.push({ label: '累積 60 筆交易', done: n >= 60, prog: Math.min(n, 60) + ' / 60' });
      const st = statsFor(T.slice(-60));
      const ok = n >= 60 && st.exp > 0 && st.conf != null && st.conf >= 0.9;
      req.push({ label: '最近 60 筆穩定獲利，九成把握不是運氣', done: ok, prog: st.conf == null ? '樣本不夠' : Math.round(st.conf * 100) + '% 把握' });
      const lt = levTrades(s).filter((t) => t.t1 >= rankTime(s, 4));
      const noLiq = lt.slice(-10).every((t) => t.why !== 'liq');
      req.push({ label: '完成 10 筆槓桿或做空交易，而且沒有被強制平倉', done: lt.length >= 10 && noLiq, prog: Math.min(lt.length, 10) + ' / 10' });
    } else if (s.rank === 5) {
      const d12 = !!(s.lessons[12] && s.lessons[12].done);
      req.push({ label: '完成第 12 關', done: d12, prog: (d12 ? 1 : 0) + ' / 1' });
      const lt = levTrades(s).slice(-50);
      req.push({ label: '累積 50 筆槓桿或做空交易', done: lt.length >= 50, prog: lt.length + ' / 50' });
      const dd = curveDD(lt);
      req.push({ label: '這 50 筆的最大回撤低於 20%', done: lt.length >= 50 && dd < 0.2, prog: lt.length ? (dd * 100).toFixed(1) + '%' : '尚無紀錄' });
      const st = statsFor(lt);
      req.push({ label: '這 50 筆的期望值為正', done: lt.length >= 50 && st.exp > 0, prog: lt.length ? (st.exp >= 0 ? '+' : '') + (st.exp * 100).toFixed(2) + '%' : '尚無紀錄' });
    }
    return { list: req, ready: req.length > 0 && req.every((r) => r.done) };
  }

  function rankTime(s, rank) {
    for (let i = s.rankLog.length - 1; i >= 0; i--) if (s.rankLog[i].rank === rank) return s.rankLog[i].t;
    return 0;
  }

  function promote(s, now, prices) {
    const r = requirements(s);
    if (!r.ready) return { ok: false, err: '升級條件還沒全部達成' };
    if (s.rank >= 5) {
      if (s.graduated) return { ok: false, err: '你已經結業了' };
      s.graduated = true;
      return { ok: true, graduated: true };
    }
    const add = RANKS[s.rank + 1].cap - RANKS[s.rank].cap;
    s.rank += 1;
    s.cash += add;
    s.peak = equity(s, prices);
    s.rankAt = s.trades.length;
    s.rankLog.push({ t: now, rank: s.rank });
    s.eqHist.push({ t: now, e: s.peak });
    return { ok: true, rank: s.rank, added: add };
  }

  function checkDemotion(s, now, prices) {
    const e = equity(s, prices);
    const cap = RANKS[s.rank].cap;
    const since = s.trades.slice(s.rankAt).filter(OWN);
    const liqs = since.slice(-10).filter((t) => t.why === 'liq').length;
    let cause = null;
    if (e < cap * 0.6) cause = 'loss';
    else if (s.rank >= 4 && liqs >= 2) cause = 'liq';
    if (!cause) return null;
    for (const o of s.orders.slice()) cancelOrder(s, o.id);
    for (const p of s.positions.slice()) {
      const px = pos(prices[p.sym]) ? prices[p.sym] : p.entry;

  function tradeBuy(side, confirmed, plan) {
    const sym = state.settings.sym;
    if (!plan && state.settings.judge === 'team') return createDeleg(side);
    if (side === 'short' && !E.canShort(state)) return toast('買跌在第 5 關（停損）過關後解鎖');
    if (!canTrade(sym)) return toast(S.mode === 'connecting' ? '行情連線中，請稍等' : '行情連線中斷，暫時不能下單');
    const { amount, lev, eq } = orderAmount();
    if (amount < E.MIN_AMOUNT) return toast(state.positions.length || state.orders.length ? '可用資金不夠，先平倉或取消掛單' : '可用資金不夠');
    const ctx = ctxNow();
    if (!confirmed) {
      const w = E.warnings(state, { sym, side, lev, amount, ref: S.prices[sym], ctx, sl: 1 }, S.prices, Date.now()).filter((x) => !/停損觸發時|盈虧比/.test(x));
      const heavy = (lev === 1 && amount / eq > 0.5) || (lev > 1 && amount * lev / eq > 1);
      const risky = w.some((x) => /剛賠一筆|單日上限/.test(x));
      if (heavy || risky) {
        S.pendingSide = side;
        S.pendingPlan = plan || null;
        return openSheet('info', '<h2>下單前確認</h2><div class="warns">' + w.map((x) => '<p>' + esc(x) + '</p>').join('') + '</div><div class="cta"><button class="btn quiet" data-act="x">先不要</button><button class="btn solid" data-act="confirmBuy">我知道風險，下單</button></div>');
      }
    }
    const r = E.openPosition(state, { sym, side, lev, amount, price: S.prices[sym], reason: plan ? Team.TYPES[plan.type].reason : null, now: Date.now(), ctx: plan ? null : ctx }, S.prices);
    if (!r.ok) return toast(r.err);
    if (plan && state.rank >= 2) {
      const px = S.prices[sym];
      const long = side === 'long';
      const okS = long ? plan.plan.stop < px : plan.plan.stop > px;
      const okT = long ? plan.plan.target > px : plan.plan.target < px;
      const rr = E.setStops(state, r.pos.id, okS ? roundP(plan.plan.stop) : null, okT ? roundP(plan.plan.target) : null, px, true);
      if (!rr.ok || r.pos.sl == null) autoBracket(r.pos);
    } else autoBracket(r.pos);
    save();
    S.cross = null;
    render();
    toast((side === 'long' ? '買漲 ' : '買跌 ') + fQ(r.pos.qty) + ' ' + sym + ' @ ' + fP(r.pos.entry) + (r.pos.sl != null ? '　停損 ' + fP(r.pos.sl) : ''));
    const chase = ctx && ((side === 'long' && ctx.chg > 0.015) || (side === 'short' && ctx.chg < -0.015));
    if (chase) setTimeout(() => toast(side === 'long' ? '提醒：價格剛急漲 ' + (ctx.chg * 100).toFixed(1) + '%，這筆可能是追高' : '提醒：價格剛急跌 ' + (-ctx.chg * 100).toFixed(1) + '%，這筆可能是追空'), 2700);
  }

      if (!r.ok) return toast(r.err);
      save(); S.cross = null; render();
      return toast('掛單' + (side === 'long' ? '買漲' : '買跌') + ' @ ' + fP(price) + '，按住線可以拖');

    const p = curPos()[0];
    if (!p) return;
    const r = E.setStops(state, p.id, act === 'xsl' ? price : p.sl, act === 'xtp' ? price : p.tp, cur);

  function nextStep() {
    for (const l of LESSONS) {
      if (lessonDone(l.id)) continue;
      if (l.rank > state.rank) break;
      if (!(l.id === 1 || lessonDone(l.id - 1))) break;
      const st = state.lessons[l.id];
      if (st && st.read && l.task && !state.flags[l.task.flag]) return { small: '第 ' + l.id + ' 關任務', text: l.task.text, short: '看任務', lesson: l.id };
      return { small: '下一步', text: '第 ' + l.id + ' 關　' + l.title, short: '第 ' + l.id + ' 關 ' + l.title, lesson: l.id };
    }
    const r = E.requirements(state);
    if (r.ready) return { small: '可以升級了', text: state.rank >= 5 ? '完成結業' : '升上段位 ' + (state.rank + 1), go: 'learn' };
    const u = r.list.find((x) => !x.done);
    if (u) return { small: '升段進度', text: u.label + '　' + u.prog, short: u.prog, go: 'learn' };
    return null;

  function drawSpark() {
    const c = $('#spark');
    if (!c) return;
    const W = c.clientWidth, H = c.clientHeight;
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    c.width = W * dpr; c.height = H * dpr;
    const g = c.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const pts = state.eqHist.map((p) => p.e).concat([E.equity(state, S.prices)]);
    const cs = getComputedStyle(document.documentElement);
    if (pts.length < 3) { g.fillStyle = cs.getPropertyValue('--muted'); g.font = '12px ' + cs.getPropertyValue('--font'); g.fillText('完成幾筆交易後，這裡會畫出你的資產變化', 0, H / 2); return; }
    let lo = Math.min(...pts), hi = Math.max(...pts);
    if (hi === lo) { hi += 1; lo -= 1; }
    const x = (i) => (i / (pts.length - 1)) * (W - 6) + 1;
    const y = (v) => 4 + ((hi - v) / (hi - lo)) * (H - 10);
    g.beginPath();
    pts.forEach((v, i) => (i ? g.lineTo(x(i), y(v)) : g.moveTo(x(i), y(v))));
    g.strokeStyle = cs.getPropertyValue('--ink'); g.lineWidth = 1.25; g.stroke();
    g.lineTo(x(pts.length - 1), H); g.lineTo(x(0), H); g.closePath();
    g.globalAlpha = 0.05; g.fillStyle = cs.getPropertyValue('--ink'); g.fill(); g.globalAlpha = 1;
    g.beginPath(); g.arc(x(pts.length - 1), y(pts[pts.length - 1]), 3, 0, 7); g.fillStyle = cs.getPropertyValue('--accent'); g.fill();
  }

      '<h3 style="margin-top:20px">出場計畫</h3><div class="calc"><div><span>進場</span><b>' + fP(p.entry) + '</b></div><div><span>停損（1R）</span><b class="down">' + fP(p.stop) + '　' + fPct((p.stop - p.entry) / p.entry) + '</b></div><div><span>停利上限（4R）</span><b class="up">' + fP(p.target) + '　' + fPct((p.target - p.entry) / p.entry) + '</b></div><div><span>移動停損</span><b>賺 1R 移到打平，賺 1.5R 後跟著最近 6 根' + (s.side === 'long' ? '低點' : '高點') + '</b></div><div><span>最長持有</span><b>4 小時</b></div></div>' +
      (rp ? '<h3 style="margin-top:20px">時光機：重播一萬次</h3><div class="odds"><div style="width:' + pct(rp.pTarget) + '" class="o-up"></div><div style="width:' + pct(rp.pNone) + '" class="o-mid"></div><div style="width:' + pct(rp.pStop) + '" class="o-down"></div></div><div class="calc"><div><span>碰到停利上限</span><b class="up">' + pct(rp.pTarget) + '</b></div><div><span>停損或移動停損出場</span><b class="down">' + pct(rp.pStop) + '</b></div><div><span>4 小時內都沒到</span><b>' + pct(rp.pNone) + '</b></div><div><span>平均結果（已扣手續費）</span><b class="' + cls(rp.avgR) + '">' + fR(rp.avgR) + '</b></div></div>' : '') +
      (res ? '<h3 style="margin-top:20px">過去 14 天同樣的訊號</h3><div class="calc"><div><span>出現次數</span><b>' + res.st.n + ' 次</b></div><div><span>勝率</span><b>' + (res.st.n ? Math.round(res.st.wr * 100) + '%' : '—') + '</b></div><div><span>平均每次</span><b class="' + cls(res.st.avgR) + '">' + (res.st.n ? fR(res.st.avgR) : '—') + '</b></div></div>' : '') +
      '<p class="say" style="margin-top:14px">這是模擬，不是預測。「我自己照計畫做」由你管這筆單；「交給團隊做」由團隊管出場，並寫進團隊筆記。</p>' +
      '<div class="cta">' + (can ? '<button class="btn" data-act="usePlan" data-id="' + esc(s.id) + '">我自己照計畫做</button><button class="btn solid" data-act="giveSig" data-id="' + esc(s.id) + '">交給團隊做</button>' : '<button class="btn quiet" data-act="x">關閉</button><button class="btn" disabled>買跌第 5 關解鎖</button>') + '</div>');
  }
  function keySheet(res) {
    const st = res.st, mc = res.mc;
    const syms = Object.keys(res.per).filter((s) => res.per[s] > 0).sort((a, b) => res.per[b] - res.per[a]);
    openSheet('info', '<h2>' + Team.TYPES[res.type].name + ' ' + SIDE[res.side] + '<span class="grade g' + res.grade + '">' + res.grade + '</span></h2><p class="say">' + esc(Team.TYPES[res.type].desc) + '。</p>' +
      '<div class="calc"><div><span>過去 14 天出現</span><b>' + st.n + ' 次</b></div><div><span>勝率</span><b>' + (st.n ? Math.round(st.wr * 100) + '%' : '—') + '</b></div><div><span>平均每次</span><b class="' + cls(st.avgR) + '">' + (st.n ? fR(st.avgR) : '—') + '</b></div><div><span>最慘連賠</span><b>' + st.maxLoss + ' 次</b></div>' +
      (mc ? '<div><span>照做 50 次：中間情況</span><b class="' + cls(mc.p50) + '">' + fR(mc.p50) + '</b></div><div><span>最差 5% / 最好 5%</span><b>' + fR(mc.p5) + ' / ' + fR(mc.p95) + '</b></div><div><span>50 次後還是賠錢的機率</span><b>' + Math.round((1 - mc.pWin) * 100) + '%</b></div><div><span>過程中一般會先回落</span><b>' + fR(-mc.ddMed) + '</b></div>' : '') + '</div>' +
      (syms.length ? '<p class="say" style="margin-top:14px">出現最多的幣：' + syms.slice(0, 5).map((s) => esc(s) + ' ' + res.per[s] + ' 次').join('、') + '</p>' : '') +
      '<p class="say">評級標準（只用回測，團隊實際下單看的是「團隊預估」）：A 級要出現 20 次以上、平均至少 +0.15R、做 50 次後賺錢的機率八成以上；B 級要 12 次以上、平均至少 +0.05R、機率六成五以上。其他都是 C 級，不列入訊號。</p>' +
      '<div class="cta"><button class="btn solid" data-act="x">知道了</button></div>');
  }
  function teamAct(act, id) {
    if (act === 'sig') { const s = TS.signals.find((x) => x.id === id); if (s) sigSheet(s); return true; }
    if (act === 'tkey') { const r = TS.results && TS.results[id]; if (r) keySheet(r); return true; }
    if (act === 'usePlan' || act === 'giveSig') {
      const s = TS.signals.find((x) => x.id === id);
      if (!s) return true;
      if (S.sheetKind) { S.sheetKind = null; $('#sheet').hidden = true; }
      if (act === 'giveSig') {
        if (teamTrade(s, true)) { toast('已交給團隊：' + SIDE[s.side] + ' ' + s.sym); state.settings.interval = '5m'; switchSym(s.sym); }
        else toast(teamPos().some((p) => p.sym === s.sym) ? '團隊已經有一筆 ' + s.sym + ' 在手上' : '價格已經離開計畫範圍，這個訊號不適合再進場');
        return true;
      }
      if (state.settings.sym !== s.sym || state.settings.interval !== '5m') { state.settings.interval = '5m'; switchSym(s.sym); }
      else go('trade');
      tradeBuy(s.side, false, s);
      return true;
    }
    if (act === 'tauto') { if (state.settings.teamPct <= 0) { toast('先把團隊額度設成大於 0%'); return true; } TS.auto = !TS.auto; saveTeam(); refreshTeam(); toast(TS.auto ? '團隊會用額度自己交易 A、B 級訊號' : '團隊只找訊號，不會自己交易'); return true; }
    if (act === 'tpct') { const v = parseFloat(id); if ([0, 0.1, 0.25, 0.5, 1].includes(v)) { state.settings.teamPct = v; save(); refreshTeam(); toast(v ? '團隊額度：總資產的 ' + v * 100 + '%' : '團隊額度 0%：團隊只找訊號'); } return true; }
    if (act === 'takeover') { const p = state.positions.find((x) => x.id === parseFloat(id)); if (p) { p.owner = 'me'; delete p.until; p.src = null; save(); toast('這筆改由你管，停損停利線可以自己拖'); if (S.sheetKind === 'book') renderBook(true); refreshTeam(); if (S.view === 'trade') render(); } return true; }
    if (act === 'tresume') { TS.halt = false; TS.resumeAt = Date.now(); teamLog('你恢復了團隊交易，回落從現在重新計算'); saveTeam(); toast('團隊恢復交易'); refreshTeam(); return true; }
    if (act === 'dcancel') { TS.delegs = TS.delegs.filter((d) => d.id !== id); teamLog('取消委託'); saveTeam(); toast('委託已取消'); if (S.sheetKind === 'book') renderBook(true); refreshTeam(); if (S.view === 'trade') render(); return true; }
    if (act === 'judge') { state.settings.judge = id === 'team' ? 'team' : 'me'; save(); renderBar(); toast(id === 'team' ? '交給團隊：按買漲買跌會委託團隊判斷進場' : '自己判斷：按了馬上成交'); return true; }
    if (act === 'sview') { if (['all', 'me', 'team'].includes(id)) { state.settings.statsView = id; save(); render(); } return true; }
    return false;
  }

  async function boot() {
    try { await syBoot(); } catch (e) { SY.err = '讀不到雲端資料，先用這台的資料'; }
    load();
    loadTeam();
    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-act]');
      if (!el || el.disabled) return;
      e.preventDefault();
      onAct(el.dataset.act, el.dataset.id, el);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('term')) onAct('term', null, e.target);
      if (e.key === 'Enter' && e.target.id === 'syncTok') { e.preventDefault(); onAct('syncGo', null, e.target); }
      if (e.key === 'Escape') { if (S.sheetKind) closeSheet(); else if (S.cross) hideCross(); }
      const tg = e.target && e.target.tagName;
      if (e.metaKey || e.ctrlKey || e.altKey || tg === 'INPUT' || tg === 'TEXTAREA' || S.sheetKind || S.lesson || S.view !== 'trade') return;
      const k = (e.key || '').toLowerCase();
      if (k === 'b' || k === 's') {
        const btn = $('#bar [data-act="buy"][data-id="' + (k === 'b' ? 'long' : 'short') + '"]') || $('#bar [data-act="order"][data-id="' + (k === 'b' ? 'long' : 'short') + '"]');
        if (btn && !btn.disabled) { e.preventDefault(); btn.click(); }
      }
    });
    $('#sheet .backdrop').addEventListener('click', () => closeSheet());
    $$('.tabs a').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); go(a.dataset.v); }));
    $('#rankPill').addEventListener('click', () => go('learn'));
    if (WIDE.addEventListener) WIDE.addEventListener('change', () => { S.hover = null; render(); });
    if (XL.addEventListener) XL.addEventListener('change', () => { S.hover = null; render(); });
    for (const ev of ['gesturestart', 'gesturechange']) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
    const h = (location.hash || '').slice(1);
    S.view = ['trade', 'team', 'learn', 'stats'].includes(h) ? h : 'trade';
    for (const k of Object.keys(state.lastPrices)) S.prices[k] = state.lastPrices[k];
    setMode('connecting', false);
    render();
    const fresh = state.coinCache && Date.now() - state.coinCache.t < 3 * 3600000;
    if (!fresh) { try { await fetchTop(); save(); } catch (e) { S.topErr = true; } }
    else setTimeout(() => fetchTop().then(() => { save(); syncTickers(); }).catch(() => { S.topErr = true; }), 1500);
    connect();
    setInterval(() => { fetchTop().then(() => { save(); syncTickers(); if (S.sheetKind === 'coins') renderCoins(true); }).catch(() => { S.topErr = true; }); }, 30 * 60000);
    setInterval(() => {
      if (S.mode === 'live' && !S.stale && Date.now() - Live.last > 15000) { setMode('live', true); try { if (Live.ws) Live.ws.close(); } catch (e) { return; } }
    }, 5000);
    setInterval(() => { E.touchDD(state, S.prices); save(); }, 10000);
    setInterval(teamPulse, 1000);
    setInterval(syTrack, 5000);
    try { if (sessionStorage.getItem('gaoqian.synced')) { sessionStorage.removeItem('gaoqian.synced'); setTimeout(() => toast('已換成另一台裝置的最新資料'), 600); } } catch (e) { SY.err = null; }
    const loop = () => {
      if (S.chartDirty && S.view === 'trade') { S.chartDirty = false; drawChart(); }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    setInterval(() => { if (S.dirty && !G.pts.size) { S.dirty = false; tickUI(); } }, 250);
    window.addEventListener('resize', () => { markChart(); drawSpark(); });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { S.hiddenAt = Date.now(); save(); saveTeam(); SY.lastPush = 0; syTrack(); return; }
      if (Date.now() - SY.lastPull > 15000) syPullApply('visible');
      if (S.mode === 'live' && Live.ws && Live.ws.readyState === 1 && S.hiddenAt && Date.now() - S.hiddenAt > 90000) onLiveReady(S.hiddenAt, false);
    });
    window.addEventListener('pagehide', save);
    window.__shidan = { S, G, get state() { return state; }, E, tick: onTick, draw: drawChart, TS, createDeleg, addSignal, teamScan, teamManage, learnRebuild, learnFromClosed, MD, guard, extAt, NW };
  }
  boot();
})();

</script>
</body>
</html>
