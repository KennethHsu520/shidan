<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="試單">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src wss://data-stream.binance.vision https://data-api.binance.vision wss://stream.binance.com:9443 https://api.binance.com; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>試單 加密貨幣模擬交易</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F6F2;
  --surface: #FFFFFF;
  --ink: #1C1B19;
  --ink2: #5E5C57;
  --muted: #9A978F;
  --line: #E4E2DB;
  --accent: #9C6B30;
  --accent-soft: #F5EEE3;
  --up: #2F7D5C;
  --down: #C0463A;
  --font: "Manrope", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
:root[data-tw="1"] { --up: #C0463A; --down: #2F7D5C; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  touch-action: pan-x pan-y;
}
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
#app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; position: relative; background: var(--bg); }
.top { display: flex; align-items: center; justify-content: space-between; padding: calc(14px + env(safe-area-inset-top)) 20px 10px; }
.brand { font-size: 17px; font-weight: 700; letter-spacing: 0.12em; }
.top-right { display: flex; align-items: center; gap: 14px; }
.feed { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
.feed i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--muted); }
.feed[data-m="live"] i { background: var(--up); border-color: var(--up); }
.feed[data-m="down"] i { background: var(--down); border-color: var(--down); }
.pill { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; color: var(--ink2); background: var(--surface); }
main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 20px 32px; }
.tabs { display: flex; border-top: 1px solid var(--line); background: var(--bg); padding-bottom: env(safe-area-inset-bottom); }
.tabs a { flex: 1; text-align: center; padding: 14px 0 13px; font-size: 13px; color: var(--muted); text-decoration: none; letter-spacing: 0.2em; position: relative; }
.tabs a.on { color: var(--ink); font-weight: 600; }
.tabs a.on::before { content: ""; position: absolute; top: -1px; left: 50%; width: 20px; margin-left: -10px; height: 1px; background: var(--ink); }
section { margin-top: 30px; }
h2 { font-size: 22px; font-weight: 600; line-height: 1.35; text-wrap: balance; }
h3 { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0.14em; margin-bottom: 10px; }
.sub { font-size: 12px; color: var(--muted); line-height: 1.6; }
.up { color: var(--up); }
.down { color: var(--down); }
.note { font-size: 12px; color: var(--ink2); background: var(--accent-soft); border-radius: 8px; padding: 9px 12px; margin-top: 10px; line-height: 1.6; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.hint { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; margin-top: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.hint small { display: block; font-size: 11px; color: var(--accent); letter-spacing: 0.12em; }
.hint span { font-size: 14px; line-height: 1.5; }
.chev { width: 7px; height: 7px; border-right: 1px solid var(--muted); border-top: 1px solid var(--muted); transform: rotate(45deg); flex: none; }
.coins { display: flex; gap: 18px; margin-top: 22px; overflow-x: auto; scrollbar-width: none; }
.coins::-webkit-scrollbar { display: none; }
.coins button { font-size: 14px; color: var(--muted); padding: 4px 0; border-bottom: 1px solid transparent; white-space: nowrap; letter-spacing: 0.04em; }
.coins button.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
.coins button.lock { opacity: 0.45; }
.quote { margin-top: 14px; }
.px { font-size: 36px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.15; }
.px small { font-size: 12px; color: var(--muted); font-weight: 400; letter-spacing: 0.06em; margin-left: 6px; }
.chartbar { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font-size: 12px; padding: 6px 12px; color: var(--ink2); }
.seg button.on { background: var(--ink); color: #fff; }
.seg.wide { display: flex; }
.seg.wide button { flex: 1; padding: 9px 0; font-size: 14px; }
.seg button:disabled { color: var(--muted); opacity: 0.6; }
.chip { font-size: 12px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink2); background: var(--surface); }
.chip.on { border-color: var(--accent); color: var(--accent); }
.chartwrap { margin: 10px -4px 0; height: 250px; position: relative; }
.chartwrap canvas { width: 100%; height: 100%; display: block; touch-action: pan-y; }
.chartmsg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); }
.acct { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.acct label, .metric label { display: block; font-size: 11px; color: var(--muted); letter-spacing: 0.08em; }
.acct b { font-size: 15px; font-weight: 600; }
.cta { display: flex; gap: 10px; margin-top: 16px; }
.btn { flex: 1; border: 1px solid var(--ink); border-radius: 10px; padding: 13px 16px; font-size: 15px; font-weight: 500; letter-spacing: 0.1em; text-align: center; background: transparent; color: var(--ink); }
.btn.solid { background: var(--ink); color: #fff; }
.btn.sm { flex: none; padding: 6px 14px; font-size: 12px; border-color: var(--line); letter-spacing: 0.06em; border-radius: 8px; }
.btn.quiet { border-color: var(--line); color: var(--ink2); }
.btn:disabled { opacity: 0.3; cursor: default; }
.btn:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.list { border-top: 1px solid var(--line); }
.row { padding: 14px 0; border-bottom: 1px solid var(--line); }
.row-main { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.row-main b { font-weight: 600; }
.row .right { text-align: right; flex: none; }
.row-actions { display: flex; gap: 8px; margin-top: 10px; }
.tag { font-size: 11px; color: var(--ink2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; margin-left: 6px; font-weight: 400; }
.empty { font-size: 13px; color: var(--muted); padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
button.row { display: block; width: 100%; text-align: left; }
.layer { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; }
.layer[hidden] { display: none; }
.backdrop { position: absolute; inset: 0; background: rgba(28, 27, 25, 0.32); }
.sheet { position: relative; background: var(--bg); border-radius: 16px 16px 0 0; max-height: 92%; overflow-y: auto; padding: 22px 20px calc(22px + env(safe-area-inset-bottom)); }
.sheet h2 { font-size: 19px; margin-bottom: 4px; }
.sheet .cta { margin-top: 20px; }
#page { z-index: 10; background: var(--bg); justify-content: flex-start; }
.page-top { display: flex; align-items: center; justify-content: space-between; padding: calc(14px + env(safe-area-inset-top)) 20px 10px; }
.page-top button { font-size: 13px; color: var(--ink2); padding: 4px 0; letter-spacing: 0.06em; }
.page-body { flex: 1; overflow-y: auto; padding: 0 24px 24px; display: flex; flex-direction: column; }
.page-foot { padding: 12px 20px calc(16px + env(safe-area-inset-bottom)); display: flex; gap: 10px; }
.bar { height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 0 20px; }
.bar i { display: block; height: 100%; background: var(--ink); }
.card { margin: auto 0; padding: 24px 0 40px; }
.card small { font-size: 11px; color: var(--accent); letter-spacing: 0.16em; }
.card h2 { font-size: 26px; margin: 10px 0 18px; }
.card p { font-size: 16px; line-height: 1.9; color: var(--ink2); max-width: 30em; }
.term { border-bottom: 1px dashed var(--accent); color: var(--ink); cursor: pointer; }
.fig { margin: 26px 0 0; display: flex; justify-content: center; }
.fig svg { width: 220px; height: auto; }
.opts { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 14px 16px; font-size: 15px; line-height: 1.55; }
.opt.right { border-color: var(--up); color: var(--up); }
.opt.wrong { border-color: var(--down); color: var(--down); }
.opt:disabled { cursor: default; }
.why { margin-top: 16px; font-size: 14px; color: var(--ink2); line-height: 1.8; }
.why b { color: var(--ink); }
.field { margin-top: 18px; }
.field > label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); letter-spacing: 0.08em; margin-bottom: 6px; }
.field input, .field select { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 12px 14px; font-size: 16px; outline-offset: 0; appearance: none; }
.quick { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.quick button { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; color: var(--ink2); background: var(--surface); }
.quick button.on { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.two .quick { gap: 6px; flex-wrap: nowrap; }
.two .quick button { padding: 4px 0; flex: 1; }
.calc { margin-top: 18px; border-top: 1px solid var(--line); }
.calc div { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 9px 0; border-bottom: 1px solid var(--line); color: var(--ink2); }
.calc div b { color: var(--ink); font-weight: 600; text-align: right; }
.warns { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.warns p { font-size: 13px; line-height: 1.65; color: #7A4E17; background: var(--accent-soft); border-radius: 8px; padding: 9px 12px; }
.err { margin-top: 12px; font-size: 13px; color: var(--down); min-height: 1px; }
.lines { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.lines p { font-size: 14px; line-height: 1.8; color: var(--ink2); padding-left: 14px; border-left: 1px solid var(--line); }
.big { font-size: 34px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.2; }
.big small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; letter-spacing: 0.06em; }
.grid { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
.metric { padding: 14px 0; border-bottom: 1px solid var(--line); text-align: left; }
.metric b { font-size: 19px; font-weight: 500; display: block; }
.meter { height: 4px; background: var(--line); border-radius: 4px; position: relative; margin: 14px 0 12px; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); border-radius: 4px; }
.meter u { position: absolute; left: 90%; top: -4px; bottom: -4px; width: 1px; background: var(--accent); }
.ladder { display: flex; align-items: center; margin: 18px 0 4px; }
.ladder i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--muted); flex: none; }
.ladder i.done { background: var(--ink); border-color: var(--ink); }
.ladder i.now { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.ladder u { flex: 1; height: 1px; background: var(--line); }
.ladder u.done { background: var(--ink); }
.ladder-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.ladder-labels span.now { color: var(--ink); font-weight: 600; }
.reqs { list-style: none; border-top: 1px solid var(--line); }
.reqs li { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 11px 0 11px 22px; border-bottom: 1px solid var(--line); font-size: 14px; position: relative; line-height: 1.5; }
.reqs li::before { content: ""; position: absolute; left: 2px; top: 17px; width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--muted); }
.reqs li.done::before { background: var(--up); border-color: var(--up); }
.reqs li span { font-size: 12px; color: var(--muted); flex: none; }
.lesson, button.row.lesson { display: flex; align-items: center; gap: 14px; }
.lesson .no { font-size: 12px; color: var(--muted); width: 20px; flex: none; }
.lesson .body { flex: 1; }
.lesson .body b { font-weight: 500; font-size: 15px; display: block; }
.lesson .st { font-size: 12px; color: var(--muted); flex: none; }
.lesson .st.go { color: var(--accent); }
.lesson.locked .body b, .lesson.locked .no { color: var(--muted); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; }
.sw { width: 40px; height: 24px; border-radius: 999px; background: var(--line); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; }
.toggle[aria-checked="true"] .sw { background: var(--ink); }
.toggle[aria-checked="true"] .sw::after { left: 19px; }
#toast { position: absolute; left: 20px; right: 20px; top: calc(58px + env(safe-area-inset-top)); z-index: 40; display: flex; justify-content: center; pointer-events: none; }
#toast span { background: var(--ink); color: #fff; font-size: 13px; padding: 9px 16px; border-radius: 999px; }
.spark { width: 100%; height: 64px; display: block; margin-top: 14px; }
.gl dt { font-weight: 600; margin-top: 20px; }
.gl dd { color: var(--ink2); font-size: 14px; line-height: 1.8; margin-top: 2px; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: rise 0.22s ease-out; }
  @keyframes rise { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
}

</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">試單</div>
    <div class="top-right">
      <span class="feed" id="feed" data-m="connecting"><i></i><span id="feedTxt">連線中</span></span>
      <button class="pill" id="rankPill" type="button">段位 1 新手</button>
    </div>
  </header>
  <main id="view"></main>
  <nav class="tabs" aria-label="主選單">
    <a href="#trade" data-v="trade">交易</a>
    <a href="#learn" data-v="learn">學習</a>
    <a href="#stats" data-v="stats">成績</a>
  </nav>
  <div class="layer" id="page" hidden>
    <div class="page-top"><span class="sub" id="pageTitle">試單</span><button type="button" data-act="pclose">關閉</button></div>
    <div class="bar"><i id="pageBar" style="width:0%"></i></div>
    <div class="page-body" id="pageBody"></div>
    <div class="page-foot" id="pageFoot" hidden></div>
  </div>
  <div class="layer" id="sheet" hidden>
    <div class="backdrop"></div>
    <div class="sheet" id="sheetBody" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" aria-live="polite"></div>
</div>
<script>
const Engine = (() => {
  const ALL = ['BTC', 'ETH', 'SOL', 'BNB', 'XRP', 'DOGE'];
  const RANKS = [
    null,
    { n: 1, name: '新手', cap: 1000, maxLev: 1, syms: ['BTC', 'ETH'] },
    { n: 2, name: '學徒', cap: 3000, maxLev: 1, syms: ['BTC', 'ETH'] },
    { n: 3, name: '交易員', cap: 10000, maxLev: 1, syms: ALL },
    { n: 4, name: '進階', cap: 30000, maxLev: 3, syms: ALL },
    { n: 5, name: '專業', cap: 100000, maxLev: 10, syms: ALL }
  ];
  const FEE_SPOT = 0.001;
  const FEE_LEV = 0.0005;
  const MMR = 0.005;
  const FUND_8H = 0.0001;
  const MIN_AMOUNT = 10;
  const REASONS = {
    trend: '順著趨勢',
    dip: '跌深反彈',
    breakout: '突破關鍵價',
    support: '支撐或壓力',
    news: '看到消息',
    gut: '憑感覺'
  };

  const fin = (x) => typeof x === 'number' && isFinite(x);
  const pos = (x) => fin(x) && x > 0;

  function newState(now) {
    return {
      v: 1,
      rank: 1,
      cash: 1000,
      positions: [],
      orders: [],
      trades: [],
      lessons: {},
      flags: {},
      rules: null,
      peak: 1000,
      maxDD: 0,
      eqHist: [{ t: now, e: 1000 }],
      nextId: 1,
      rankAt: 0,
      rankLog: [{ t: now, rank: 1 }],
      graduated: false,
      refills: 0,
      lastSeen: now,
      lastPrices: {},
      settings: { twColors: false, ma: false, sym: 'BTC', interval: '1m' }
    };
  }

  function isLev(p) {
    return p.lev > 1 || p.side === 'short';
  }

  function feeRate(p) {
    return isLev(p) ? FEE_LEV : FEE_SPOT;
  }

  function liqPrice(side, entry, lev) {
    if (side === 'long') {
      if (lev <= 1) return 0;
      return entry * (1 - 1 / lev + MMR);
    }
    return entry * (1 + 1 / lev - MMR);
  }

  function posPnl(p, price) {
    return (price - p.entry) * p.qty * (p.side === 'long' ? 1 : -1);
  }

  function posValue(p, price) {
    return Math.max(0, p.margin + posPnl(p, price));
  }

  function equity(s, prices) {
    let e = s.cash;
    for (const o of s.orders) e += o.reserve;
    for (const p of s.positions) {
      const px = pos(prices[p.sym]) ? prices[p.sym] : p.entry;
      e += posValue(p, px);
    }
    return e;
  }

  function touchDD(s, prices) {
    const e = equity(s, prices);
    if (e > s.peak) s.peak = e;
    if (s.peak > 0) {
      const dd = (s.peak - e) / s.peak;
      if (dd > s.maxDD) s.maxDD = dd;
    }
    return e;
  }

  function validateStops(side, ref, sl, tp, lev) {
    if (sl != null) {
      if (!pos(sl)) return '停損價要是大於 0 的數字';
      if (side === 'long' && sl >= ref) return '買進的停損價要低於進場價';
      if (side === 'short' && sl <= ref) return '做空的停損價要高於進場價';
      const liq = liqPrice(side, ref, lev);
      if (side === 'long' && liq > 0 && sl <= liq) return '停損價比強制平倉價還遠，等於沒設。請設得更靠近進場價';
      if (side === 'short' && sl >= liq) return '停損價比強制平倉價還遠，等於沒設。請設得更靠近進場價';
    }
    if (tp != null) {
      if (!pos(tp)) return '停利價要是大於 0 的數字';
      if (side === 'long' && tp <= ref) return '買進的停利價要高於進場價';
      if (side === 'short' && tp >= ref) return '做空的停利價要低於進場價';
    }
    return null;
  }

  function checkOrderInput(s, o) {
    const r = RANKS[s.rank];
    if (!r.syms.includes(o.sym)) return '這個幣種要到更高段位才會解鎖';
    if (o.side !== 'long' && o.side !== 'short') return '方向不正確';
    if (o.side === 'short' && s.rank < 4) return '做空要到段位 4 才會解鎖';
    if (!Number.isInteger(o.lev) || o.lev < 1) return '槓桿倍數不正確';
    if (o.lev > r.maxLev) return '這個槓桿倍數還沒解鎖';
    if (!pos(o.amount)) return '請輸入金額';
    if (o.amount < MIN_AMOUNT) return '最少要下 ' + MIN_AMOUNT + ' USDT';
    if ((o.sl != null || o.tp != null) && s.rank < 2) return '停損停利要到段位 2 才會解鎖';
    if (!REASONS[o.reason]) return '請選一個下單的理由';
    return null;
  }

  function costOf(o) {
    const rate = o.lev > 1 || o.side === 'short' ? FEE_LEV : FEE_SPOT;
    return o.amount + o.amount * o.lev * rate;
  }

  function maxAmount(cash, lev, side) {
    const rate = lev > 1 || side === 'short' ? FEE_LEV : FEE_SPOT;
    return Math.floor((cash / (1 + lev * rate)) * 100) / 100;
  }

  function openPosition(s, o, prices) {
    const err = checkOrderInput(s, o);
    if (err) return { ok: false, err };
    if (!pos(o.price)) return { ok: false, err: '目前沒有報價，請稍後再試' };
    const sl = o.sl == null ? null : o.sl;
    const tp = o.tp == null ? null : o.tp;
    const e2 = validateStops(o.side, o.price, sl, tp, o.lev);
    if (e2) return { ok: false, err: e2 };
    const cost = costOf(o);
    if (cost > s.cash + 1e-9) return { ok: false, err: '可用資金不夠（含手續費需要 ' + cost.toFixed(2) + ' USDT）' };
    const eq0 = equity(s, prices) + (o.fromReserve || 0);
    const notional = o.amount * o.lev;
    const fee = cost - o.amount;
    const qty = notional / o.price;
    s.cash -= cost;
    const p = {
      id: s.nextId++,
      sym: o.sym,
      side: o.side,
      lev: o.lev,
      qty,
      entry: o.price,
      margin: o.amount,
      feeOpen: fee,
      sl,
      tp,
      reason: o.reason,
      t0: o.now,
      eq0,
      sizePct: o.amount / eq0,
      riskPct: sl != null ? (Math.abs(o.price - sl) * qty) / eq0 : null,
      hadSL: sl != null,
      liq: liqPrice(o.side, o.price, o.lev),
      ctx: o.ctx || null,
      afterLoss: recentLoss(s, o.now)
    };
    s.positions.push(p);
    markOpenFlags(s, p);
    return { ok: true, pos: p };
  }

  function recentLoss(s, now) {
    const t = s.trades[s.trades.length - 1];
    if (!t || t.pnl >= 0) return null;
    if (now - t.t1 > 5 * 60000) return null;
    return { sizePct: t.sizePct };
  }

  function markOpenFlags(s, p) {
    s.flags.opened = true;
    if (p.sl != null) s.flags.slSet = true;
    if (p.sl != null && p.tp != null) {
      const rr = Math.abs(p.tp - p.entry) / Math.abs(p.entry - p.sl);
      if (rr >= 1.5 - 1e-9) s.flags.rr = true;
    }
    if (p.riskPct != null && p.riskPct <= 0.02 + 1e-9) s.flags.risk2 = true;
    if (p.reason === 'trend' && p.ctx && p.ctx.above != null) {
      if ((p.side === 'long' && p.ctx.above) || (p.side === 'short' && !p.ctx.above)) s.flags.trendTrade = true;
    }
  }

  function createOrder(s, o) {
    const err = checkOrderInput(s, o);
    if (err) return { ok: false, err };
    if (!pos(o.limit)) return { ok: false, err: '請輸入限價' };
    if (!pos(o.cur)) return { ok: false, err: '目前沒有報價，請稍後再試' };
    if (o.side === 'long' && o.limit >= o.cur) return { ok: false, err: '買進的限價要低於現價。想馬上成交請用市價' };
    if (o.side === 'short' && o.limit <= o.cur) return { ok: false, err: '做空的限價要高於現價。想馬上成交請用市價' };
    const sl = o.sl == null ? null : o.sl;
    const tp = o.tp == null ? null : o.tp;
    const e2 = validateStops(o.side, o.limit, sl, tp, o.lev);
    if (e2) return { ok: false, err: e2 };
    const cost = costOf(o);
    if (cost > s.cash + 1e-9) return { ok: false, err: '可用資金不夠（含手續費需要 ' + cost.toFixed(2) + ' USDT）' };
    s.cash -= cost;
    const ord = {
      id: s.nextId++,
      sym: o.sym,
      side: o.side,
      lev: o.lev,
      amount: o.amount,
      limit: o.limit,
      sl,
      tp,
      reason: o.reason,
      t: o.now,
      reserve: cost,
      ctx: o.ctx || null
    };
    s.orders.push(ord);
    s.flags.limitPlaced = true;
    return { ok: true, order: ord };
  }

  function cancelOrder(s, id) {
    const i = s.orders.findIndex((x) => x.id === id);
    if (i < 0) return { ok: false, err: '找不到這張掛單' };
    s.cash += s.orders[i].reserve;
    s.orders.splice(i, 1);
    return { ok: true };
  }

  function setStops(s, id, sl, tp, price) {
    if (s.rank < 2) return { ok: false, err: '停損停利要到段位 2 才會解鎖' };
    const p = s.positions.find((x) => x.id === id);
    if (!p) return { ok: false, err: '找不到這筆持倉' };
    if (!pos(price)) return { ok: false, err: '目前沒有報價，請稍後再試' };
    if (sl != null) {
      if (!pos(sl)) return { ok: false, err: '停損價要是大於 0 的數字' };
      if (p.side === 'long' && sl >= price) return { ok: false, err: '停損價要低於現價，不然會馬上觸發' };
      if (p.side === 'short' && sl <= price) return { ok: false, err: '停損價要高於現價，不然會馬上觸發' };
      if (p.side === 'long' && p.liq > 0 && sl <= p.liq) return { ok: false, err: '停損價比強制平倉價還遠，等於沒設' };
      if (p.side === 'short' && sl >= p.liq) return { ok: false, err: '停損價比強制平倉價還遠，等於沒設' };
    }
    if (tp != null) {
      if (!pos(tp)) return { ok: false, err: '停利價要是大於 0 的數字' };
      if (p.side === 'long' && tp <= price) return { ok: false, err: '停利價要高於現價，不然會馬上觸發' };
      if (p.side === 'short' && tp >= price) return { ok: false, err: '停利價要低於現價，不然會馬上觸發' };
    }
    p.sl = sl;
    p.tp = tp;
    if (sl != null) {
      p.hadSL = true;
      if (p.riskPct == null) {
        const adverse = p.side === 'long' ? p.entry - sl : sl - p.entry;
        p.riskPct = Math.max(0, adverse * p.qty) / p.eq0;
      }
    }
    markOpenFlags(s, p);
    return { ok: true };
  }

  function closePosition(s, id, price, now, why, prices) {
    const i = s.positions.findIndex((x) => x.id === id);
    if (i < 0) return { ok: false, err: '找不到這筆持倉' };
    if (!pos(price)) return { ok: false, err: '目前沒有報價，請稍後再試' };
    const p = s.positions[i];
    const rate = feeRate(p);
    const gross = posPnl(p, price);
    const hours = Math.max(0, now - p.t0) / 3600000;
    const funding = isLev(p) ? p.qty * p.entry * FUND_8H * (hours / 8) : 0;
    let feeClose = p.qty * price * rate;
    let payout = p.margin + gross - feeClose - funding;
    let reason = why;
    if (why === 'liq' || payout <= 0) {
      payout = 0;
      feeClose = 0;
      if (isLev(p)) reason = 'liq';
    }
    const pnl = payout - p.margin - p.feeOpen;
    s.cash += payout;
    s.positions.splice(i, 1);
    const t = {
      id: p.id,
      sym: p.sym,
      side: p.side,
      lev: p.lev,
      qty: p.qty,
      entry: p.entry,
      exit: price,
      margin: p.margin,
      gross,
      fees: p.feeOpen + feeClose,
      funding,
      pnl,
      ret: pnl / p.eq0,
      pct: pnl / p.margin,
      t0: p.t0,
      t1: now,
      why: reason,
      reason: p.reason,
      hadSL: p.hadSL,
      sl: p.sl,
      tp: p.tp,
      sizePct: p.sizePct,
      riskPct: p.riskPct,
      ctx: p.ctx,
      afterLoss: p.afterLoss,
      rank: s.rank
    };
    s.trades.push(t);
    if (s.trades.length > 2000) {
      const cut = s.trades.length - 2000;
      s.trades.splice(0, cut);
      s.rankAt = Math.max(0, s.rankAt - cut);
    }
    s.flags.closed = true;
    const px = Object.assign({}, prices);
    px[p.sym] = price;
    const e = touchDD(s, px);
    s.eqHist.push({ t: now, e });
    if (s.eqHist.length > 400) s.eqHist.splice(0, s.eqHist.length - 400);
    return { ok: true, trade: t };
  }

  function processRange(s, sym, lo, hi, last, now, prices, exact) {
    const events = [];
    for (const o of s.orders.slice()) {
      if (o.sym !== sym) continue;
      const hit = o.side === 'long' ? lo <= o.limit : hi >= o.limit;
      if (!hit) continue;
      s.orders.splice(s.orders.indexOf(o), 1);
      s.cash += o.reserve;
      const saved = s.flags.limitPlaced;
      const r = openPosition(
        s,
        { sym, side: o.side, lev: o.lev, amount: o.amount, price: o.limit, sl: o.sl, tp: o.tp, reason: o.reason, now, ctx: o.ctx },
        prices
      );
      s.flags.limitPlaced = saved;
      if (r.ok) {
        r.pos.fresh = true;
        events.push({ type: 'fill', pos: r.pos });
      }
    }
    for (const p of s.positions.slice()) {
      if (p.sym !== sym) continue;
      if (p.fresh) {
        delete p.fresh;
        if (!exact) continue;
      }
      const long = p.side === 'long';
      let px = null;
      let why = null;
      const liqHit = long ? p.liq > 0 && lo <= p.liq : hi >= p.liq;
      const slHit = p.sl != null && (long ? lo <= p.sl : hi >= p.sl);
      const tpHit = p.tp != null && (long ? hi >= p.tp : lo <= p.tp);
      if (slHit) {
        why = 'sl';
        px = exact ? last : p.sl;
      } else if (liqHit) {
        why = 'liq';
        px = p.liq;
      } else if (tpHit) {
        why = 'tp';
        px = p.tp;
      }
      if (!why) continue;
      const r = closePosition(s, p.id, px, now, why, prices);
      if (r.ok) events.push({ type: r.trade.why, trade: r.trade });
    }
    return events;
  }

  function onPrice(s, sym, price, now, prices) {
    if (!pos(price)) return [];
    return processRange(s, sym, price, price, price, now, prices, true);
  }

  function onCandle(s, sym, c, prices) {
    if (!c || !pos(c.l) || !pos(c.h) || c.h < c.l) return [];
    return processRange(s, sym, c.l, c.h, c.c, c.t, prices, false);
  }

  function lgamma(x) {
    const g = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.001208650973866179, -0.000005395239384953];
    let y = x;
    let tmp = x + 5.5;
    tmp -= (x + 0.5) * Math.log(tmp);
    let ser = 1.000000000190015;
    for (let j = 0; j < 6; j++) ser += g[j] / ++y;
    return -tmp + Math.log((2.5066282746310005 * ser) / x);
  }

  function betacf(a, b, x) {
    const FPMIN = 1e-300;
    const qab = a + b;
    const qap = a + 1;
    const qam = a - 1;
    let c = 1;
    let d = 1 - (qab * x) / qap;
    if (Math.abs(d) < FPMIN) d = FPMIN;
    d = 1 / d;
    let h = d;
    for (let m = 1; m <= 200; m++) {
      const m2 = 2 * m;
      let aa = (m * (b - m) * x) / ((qam + m2) * (a + m2));
      d = 1 + aa * d;
      if (Math.abs(d) < FPMIN) d = FPMIN;
      c = 1 + aa / c;
      if (Math.abs(c) < FPMIN) c = FPMIN;
      d = 1 / d;
      h *= d * c;
      aa = (-(a + m) * (qab + m) * x) / ((a + m2) * (qap + m2));
      d = 1 + aa * d;
      if (Math.abs(d) < FPMIN) d = FPMIN;
      c = 1 + aa / c;
      if (Math.abs(c) < FPMIN) c = FPMIN;
      d = 1 / d;
      const del = d * c;
      h *= del;
      if (Math.abs(del - 1) < 3e-12) break;
    }
    return h;
  }

  function ibeta(a, b, x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    const bt = Math.exp(lgamma(a + b) - lgamma(a) - lgamma(b) + a * Math.log(x) + b * Math.log(1 - x));
    if (x < (a + 1) / (a + b + 2)) return (bt * betacf(a, b, x)) / a;
    return 1 - (bt * betacf(b, a, 1 - x)) / b;
  }

  function tcdf(t, df) {
    const x = df / (df + t * t);
    const p = 0.5 * ibeta(df / 2, 0.5, x);
    return t > 0 ? 1 - p : p;
  }

  function statsFor(trades) {
    const n = trades.length;
    const out = { n, wins: 0, losses: 0, winRate: 0, avgWin: 0, avgLoss: 0, exp: 0, pf: null, pnl: 0, conf: null, slRate: 0, payoff: null };
    if (!n) return out;
    let sw = 0;
    let sl = 0;
    let gw = 0;
    let gl = 0;
    let sum = 0;
    let withSL = 0;
    for (const t of trades) {
      sum += t.ret;
      out.pnl += t.pnl;
      if (t.hadSL) withSL++;
      if (t.pnl > 0) {
        out.wins++;
        sw += t.ret;
        gw += t.pnl;
      } else {
        out.losses++;
        sl += t.ret;
        gl += -t.pnl;
      }
    }
    out.winRate = out.wins / n;
    out.avgWin = out.wins ? sw / out.wins : 0;
    out.avgLoss = out.losses ? sl / out.losses : 0;
    out.exp = sum / n;
    out.pf = gl > 0 ? gw / gl : gw > 0 ? Infinity : null;
    out.payoff = out.avgLoss < 0 && out.wins ? out.avgWin / -out.avgLoss : null;
    out.slRate = withSL / n;
    if (n >= 20) {
      let v = 0;
      for (const t of trades) v += (t.ret - out.exp) * (t.ret - out.exp);
      const sd = Math.sqrt(v / (n - 1));
      if (sd > 0) out.conf = tcdf(out.exp / (sd / Math.sqrt(n)), n - 1);
      else out.conf = out.exp > 0 ? 1 : 0;
    }
    return out;
  }

  function curveDD(trades) {
    let e = 1;
    let peak = 1;
    let dd = 0;
    for (const t of trades) {
      e *= 1 + t.ret;
      if (e > peak) peak = e;
      dd = Math.max(dd, (peak - e) / peak);
    }
    return dd;
  }

  function levTrades(s) {
    return s.trades.filter((t) => t.lev > 1 || t.side === 'short');
  }

  function lessonsDone(s, ids) {
    return ids.every((i) => s.lessons[i] && s.lessons[i].done);
  }

  function requirements(s) {
    const T = s.trades;
    const n = T.length;
    const req = [];
    const lessonReq = (ids) => {
      const done = ids.filter((i) => s.lessons[i] && s.lessons[i].done).length;
      req.push({ label: '完成第 ' + ids[0] + '～' + ids[ids.length - 1] + ' 關', done: done === ids.length, prog: done + ' / ' + ids.length });
    };
    if (s.rank === 1) {
      lessonReq([1, 2, 3, 4]);
    } else if (s.rank === 2) {
      lessonReq([5, 6, 7]);
      req.push({ label: '累積 20 筆交易', done: n >= 20, prog: Math.min(n, 20) + ' / 20' });
      const st = statsFor(T.slice(-20));
      req.push({ label: '最近 20 筆有九成設了停損', done: n >= 20 && st.slRate >= 0.9 - 1e-9, prog: n ? Math.round(st.slRate * 100) + '%' : '尚無紀錄' });
    } else if (s.rank === 3) {
      lessonReq([8, 9, 10, 11]);
      req.push({ label: '累積 40 筆交易', done: n >= 40, prog: Math.min(n, 40) + ' / 40' });
      const st = statsFor(T.slice(-40));
      req.push({ label: '最近 40 筆的期望值為正', done: n >= 40 && st.exp > 0, prog: n ? (st.exp >= 0 ? '+' : '') + (st.exp * 100).toFixed(2) + '%' : '尚無紀錄' });
    } else if (s.rank === 4) {
      req.push({ label: '累積 60 筆交易', done: n >= 60, prog: Math.min(n, 60) + ' / 60' });
      const st = statsFor(T.slice(-60));
      const ok = n >= 60 && st.exp > 0 && st.conf != null && st.conf >= 0.9;
      req.push({ label: '最近 60 筆穩定獲利，九成把握不是運氣', done: ok, prog: st.conf == null ? '樣本不夠' : Math.round(st.conf * 100) + '% 把握' });
      const lt = levTrades(s).filter((t) => t.t1 >= rankTime(s, 4));
      const noLiq = lt.slice(-10).every((t) => t.why !== 'liq');
      req.push({ label: '完成 10 筆槓桿或做空交易，而且沒有被強制平倉', done: lt.length >= 10 && noLiq, prog: Math.min(lt.length, 10) + ' / 10' });
    } else if (s.rank === 5) {
      const d12 = !!(s.lessons[12] && s.lessons[12].done);
      req.push({ label: '完成第 12 關', done: d12, prog: (d12 ? 1 : 0) + ' / 1' });
      const lt = levTrades(s).slice(-50);
      req.push({ label: '累積 50 筆槓桿或做空交易', done: lt.length >= 50, prog: lt.length + ' / 50' });
      const dd = curveDD(lt);
      req.push({ label: '這 50 筆的最大回撤低於 20%', done: lt.length >= 50 && dd < 0.2, prog: lt.length ? (dd * 100).toFixed(1) + '%' : '尚無紀錄' });
      const st = statsFor(lt);
      req.push({ label: '這 50 筆的期望值為正', done: lt.length >= 50 && st.exp > 0, prog: lt.length ? (st.exp >= 0 ? '+' : '') + (st.exp * 100).toFixed(2) + '%' : '尚無紀錄' });
    }
    return { list: req, ready: req.length > 0 && req.every((r) => r.done) };
  }

  function rankTime(s, rank) {
    for (let i = s.rankLog.length - 1; i >= 0; i--) if (s.rankLog[i].rank === rank) return s.rankLog[i].t;
    return 0;
  }

  function promote(s, now, prices) {
    const r = requirements(s);
    if (!r.ready) return { ok: false, err: '升級條件還沒全部達成' };
    if (s.rank >= 5) {
      if (s.graduated) return { ok: false, err: '你已經結業了' };
      s.graduated = true;
      return { ok: true, graduated: true };
    }
    const add = RANKS[s.rank + 1].cap - RANKS[s.rank].cap;
    s.rank += 1;
    s.cash += add;
    s.peak = equity(s, prices);
    s.rankAt = s.trades.length;
    s.rankLog.push({ t: now, rank: s.rank });
    s.eqHist.push({ t: now, e: s.peak });
    return { ok: true, rank: s.rank, added: add };
  }

  function checkDemotion(s, now, prices) {
    const e = equity(s, prices);
    const cap = RANKS[s.rank].cap;
    const since = s.trades.slice(s.rankAt);
    const liqs = since.slice(-10).filter((t) => t.why === 'liq').length;
    let cause = null;
    if (e < cap * 0.6) cause = 'loss';
    else if (s.rank >= 4 && liqs >= 2) cause = 'liq';
    if (!cause) return null;
    for (const o of s.orders.slice()) cancelOrder(s, o.id);
    for (const p of s.positions.slice()) {
      const px = pos(prices[p.sym]) ? prices[p.sym] : p.entry;
      closePosition(s, p.id, px, now, 'demote', prices);
    }
    if (s.rank === 1) {
      s.cash = RANKS[1].cap;
      s.refills += 1;
      s.peak = s.cash;
      s.rankAt = s.trades.length;
      s.eqHist.push({ t: now, e: s.cash });
      return { type: 'refill', cause };
    }
    s.rank -= 1;
    s.cash = RANKS[s.rank].cap;
    s.peak = s.cash;
    s.rankAt = s.trades.length;
    s.rankLog.push({ t: now, rank: s.rank });
    s.eqHist.push({ t: now, e: s.cash });
    return { type: 'demote', cause, rank: s.rank };
  }

  function warnings(s, o, prices, now) {
    const w = [];
    const eq = equity(s, prices);
    const size = o.amount / eq;
    const lev = o.lev || 1;
    if (pos(o.amount) && lev === 1 && size > 0.5) w.push('這筆押了總資產的 ' + Math.round(size * 100) + '%。一次押超過一半，看錯一次就很傷。');
    if (pos(o.amount) && lev > 1 && size * lev > 1) w.push('這筆的實際部位是總資產的 ' + (size * lev).toFixed(1) + ' 倍，漲跌都會被放大。');
    if (s.rank >= 2 && o.sl == null) w.push('這筆沒有設停損。沒有停損，就沒有「最多賠多少」的上限。');
    if (o.sl != null && pos(o.amount) && pos(o.ref)) {
      const risk = ((Math.abs(o.ref - o.sl) / o.ref) * o.amount * lev) / eq;
      const lim = s.rules ? s.rules.risk : 0.02;
      if (risk > lim + 1e-9) w.push('停損觸發時會賠掉總資產的 ' + (risk * 100).toFixed(1) + '%，超過' + (s.rules ? '你自己訂的' : '建議的') + ' ' + (lim * 100).toFixed(0) + '%。');
    }
    if (s.rules && o.sl != null && o.tp != null && pos(o.ref)) {
      const rr = Math.abs(o.tp - o.ref) / Math.abs(o.ref - o.sl);
      if (rr < s.rules.rr - 1e-9) w.push('盈虧比只有 ' + rr.toFixed(1) + '，低於你自己訂的 ' + s.rules.rr + '。');
    }
    if (lev > 1 && pos(o.ref)) w.push('槓桿 ' + lev + ' 倍：價格反向約 ' + ((1 / lev - MMR) * 100).toFixed(1) + '% 就會被強制平倉，保證金全部賠光。');
    if (o.ctx && o.ctx.chg != null) {

  function ctxNow() {
    const k = S.candles;
    if (k.length < 22) return null;
    const p = S.prices[state.settings.sym];
    const n = k.length;
    let sum = 0;
    for (let i = n - 20; i < n; i++) sum += k[i].c;
    let vs = 0;
    for (let i = n - 22; i < n - 2; i++) vs += k[i].v;
    const va = vs / 20;
    return { above: p > sum / 20, chg: p / k[n - 21].c - 1, volR: va > 0 ? Math.max(k[n - 1].v, k[n - 2].v) / va : null, ma: sum / 20 };
  }

  let cvs, ctx2;
  function drawChart() {
    cvs = $('#chart');
    if (!cvs) return;
    const msg = $('#chartMsg');
    const wrap = cvs.parentElement;
    const W = wrap.clientWidth, H = wrap.clientHeight;
    if (!W || !H) return;
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    if (cvs.width !== Math.round(W * dpr) || cvs.height !== Math.round(H * dpr)) { cvs.width = Math.round(W * dpr); cvs.height = Math.round(H * dpr); }
    ctx2 = cvs.getContext('2d');
    const g = ctx2;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    const all = S.candles;
    if (all.length < 2) { msg.hidden = false; msg.textContent = S.chartErr ? '圖表資料載入失敗，價格仍會更新' : '圖表載入中'; return; }
    msg.hidden = true;
    const cs = getComputedStyle(document.documentElement);
    const col = (n) => cs.getPropertyValue(n).trim();
    const up = col('--up'), down = col('--down'), line = col('--line'), muted = col('--muted'), ink = col('--ink'), accent = col('--accent');
    const maxVis = Math.max(20, Math.min(240, all.length));
    if (S.vis > maxVis) S.vis = maxVis;
    S.off = Math.max(0, Math.min(S.off, all.length - Math.min(S.vis, all.length)));
    const end = all.length - S.off;
    const start = Math.max(0, end - S.vis);
    const k = all.slice(start, end);
    const N = k.length;
    const lastP = all[all.length - 1].c;
    const padR = 58, padT = 10, volH = 40, gap = 12;
    const pw = W - padR - 4, ph = H - padT - volH - gap - 4;
    let lo = Infinity, hi = -Infinity, vmax = 0;
    for (const c of k) { if (c.l < lo) lo = c.l; if (c.h > hi) hi = c.h; if (c.v > vmax) vmax = c.v; }
    let ma = null;
    if (state.settings.ma && state.rank >= 3 && all.length >= 20) {
      ma = [];
      for (let i = start; i < end; i++) {
        if (i < 19) { ma.push(null); continue; }
        let s = 0;
        for (let j = i - 19; j <= i; j++) s += all[j].c;
        ma.push(s / 20);
        if (s / 20 < lo) lo = s / 20;
        if (s / 20 > hi) hi = s / 20;
      }
    }
    const pad = (hi - lo) * 0.08 || hi * 0.001;
    lo -= pad; hi += pad;
    const y = (p) => padT + ((hi - p) / (hi - lo)) * ph;
    const step = pw / S.vis;
    const x0 = 4 + (S.vis - N) * step;
    const bw = Math.max(1, Math.min(14, step * 0.62));
    g.font = '10px ' + cs.getPropertyValue('--font');
    g.textBaseline = 'middle';
    g.lineWidth = 1;
    for (let i = 0; i <= 3; i++) {
      const p = lo + ((hi - lo) * i) / 3;
      const yy = Math.round(y(p)) + 0.5;
      g.strokeStyle = line;
      g.beginPath(); g.moveTo(4, yy); g.lineTo(4 + pw, yy); g.stroke();
      if (Math.abs(yy - y(lastP)) > 13) { g.fillStyle = muted; g.fillText(fP(p), W - padR + 6, yy); }
    }
    k.forEach((c, i) => {
      const cx = x0 + i * step + step / 2;
      const rise = c.c >= c.o;
      g.strokeStyle = g.fillStyle = rise ? up : down;
      g.beginPath(); g.moveTo(Math.round(cx) + 0.5, y(c.h)); g.lineTo(Math.round(cx) + 0.5, y(c.l)); g.stroke();
      const yo = y(c.o), yc = y(c.c);
      g.fillRect(cx - bw / 2, Math.min(yo, yc), bw, Math.max(1, Math.abs(yc - yo)));
      if (vmax > 0) {
        const vh = (c.v / vmax) * volH;
        g.globalAlpha = 0.35;
        g.fillRect(cx - bw / 2, H - 4 - vh, bw, vh);
        g.globalAlpha = 1;
      }
    });
    if (ma) {
      g.strokeStyle = accent;
      g.lineWidth = 1.25;
      g.beginPath();
      let started = false;
      ma.forEach((v, i) => { if (v == null) return; const cx = x0 + i * step + step / 2; if (!started) { g.moveTo(cx, y(v)); started = true; } else g.lineTo(cx, y(v)); });
      g.stroke();
      g.lineWidth = 1;
    }
    const tagLine = (p, color, label, dash) => {
      if (!(p > lo && p < hi)) return;
      const yy = Math.round(y(p)) + 0.5;
      g.strokeStyle = color;
      g.setLineDash(dash);
      g.beginPath(); g.moveTo(4, yy); g.lineTo(4 + pw, yy); g.stroke();
      g.setLineDash([]);
      g.fillStyle = color;
      g.fillText(label, 8, yy - 8);
    };
    for (const p of state.positions) {
      if (p.sym !== state.settings.sym) continue;
      tagLine(p.entry, ink, '進場', [2, 3]);
      if (p.sl != null) tagLine(p.sl, down, '停損', [5, 4]);
      if (p.tp != null) tagLine(p.tp, up, '停利', [5, 4]);
    }
    for (const o of state.orders) if (o.sym === state.settings.sym) tagLine(o.limit, accent, '掛單', [2, 3]);
    const last = lastP;
    if (!(last > lo && last < hi)) return;
    const yl = Math.round(y(last)) + 0.5;
    g.strokeStyle = ink;
    g.setLineDash([1, 3]);
    g.beginPath(); g.moveTo(4, yl); g.lineTo(4 + pw, yl); g.stroke();
    g.setLineDash([]);
    g.fillStyle = ink;
    const lw = g.measureText(fP(last)).width + 10;
    g.fillRect(W - padR + 2, yl - 8, lw, 16);
    g.fillStyle = '#fff';
    g.fillText(fP(last), W - padR + 7, yl);
  }
  const G = { pts: new Map(), d0: 1, vis0: 60, x0: 0, off0: 0 };
  function bindChart() {
    const c = $('#chart');
    if (!c || c.dataset.bound) return;
    c.dataset.bound = '1';
    const dist = () => { const a = Array.from(G.pts.values()); return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1; };
    const anchor = (x) => { G.x0 = x; G.off0 = S.off; };
    c.addEventListener('pointerdown', (e) => {
      G.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      try { c.setPointerCapture(e.pointerId); } catch (err) { G.cap = false; }
      if (G.pts.size === 1) anchor(e.clientX);
      if (G.pts.size === 2) { G.d0 = dist(); G.vis0 = S.vis; }
    });
    c.addEventListener('pointermove', (e) => {
      if (!G.pts.has(e.pointerId)) return;
      G.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const n = S.candles.length;
      if (n < 2) return;
      if (G.pts.size >= 2) S.vis = Math.max(20, Math.min(Math.max(20, Math.min(240, n)), Math.round((G.vis0 * G.d0) / dist())));
      else S.off = Math.max(0, Math.min(Math.max(0, n - S.vis), G.off0 + Math.round((e.clientX - G.x0) / ((c.clientWidth - 62) / S.vis))));
      drawChart();
    });
    const up = (e) => {
      G.pts.delete(e.pointerId);
      if (G.pts.size === 1) anchor(Array.from(G.pts.values())[0].x);
    };
    c.addEventListener('pointerup', up);
    c.addEventListener('pointercancel', up);
    c.addEventListener('dblclick', () => { S.vis = 60; S.off = 0; drawChart(); });
    c.addEventListener('wheel', (e) => { e.preventDefault(); S.vis = Math.max(20, Math.min(240, Math.round(S.vis * (e.deltaY > 0 ? 1.1 : 0.9)))); drawChart(); }, { passive: false });
  }
  function drawSpark() {
    const c = $('#spark');
    if (!c) return;
    const W = c.clientWidth, H = c.clientHeight;
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    c.width = W * dpr; c.height = H * dpr;

    const cs = getComputedStyle(document.documentElement);

    let lo = Math.min(...pts), hi = Math.max(...pts);
    if (hi === lo) { hi += 1; lo -= 1; }
    const x = (i) => (i / (pts.length - 1)) * (W - 6) + 1;
    const y = (v) => 4 + ((hi - v) / (hi - lo)) * (H - 10);
    g.beginPath();
    pts.forEach((v, i) => (i ? g.lineTo(x(i), y(v)) : g.moveTo(x(i), y(v))));
    g.strokeStyle = cs.getPropertyValue('--ink');
    g.lineWidth = 1.25;
    g.stroke();
    g.lineTo(x(pts.length - 1), H); g.lineTo(x(0), H); g.closePath();
    g.globalAlpha = 0.05; g.fillStyle = cs.getPropertyValue('--ink'); g.fill(); g.globalAlpha = 1;
    g.beginPath(); g.arc(x(pts.length - 1), y(pts[pts.length - 1]), 3, 0, 7); g.fillStyle = cs.getPropertyValue('--accent'); g.fill();
  }

    const f = S.form;

    const o = readOrder();

    if (o.amount > 0 && o.ref > 0) {
      const notional = o.amount * o.lev;
      rows.push(['大約可以' + (o.side === 'long' ? '買到' : '賣出'), fQ(notional / o.ref) + ' ' + f.sym]);

    if (o.amount == null) return fail('請輸入金額，只能是數字');
    if (f.kind === 'limit' && o.limit == null) return fail('請輸入限價，只能是數字');
    if (o.badSl) return fail('停損價只能是數字');
    if (o.badTp) return fail('停利價只能是數字');
    if (!o.reason) return fail('請選一個下單的理由');

      const o = typeof q === 'function' ? q(c) : q;
      const opts = shuffle(o.opts.map((t, i) => ({ t, ok: i === o.a })));
      return { q: o.q, opts, why: o.why };
    });
  }
  function openLesson(id) {
    const l = LESSONS.find((x) => x.id === id);
    if (!l) return;
    if (!(lessonOpen(l) || lessonDone(id))) { toast('第 ' + id + ' 關還沒解鎖'); return; }
    const st = state.lessons[id] || {};
    let phase = 'cards';
    if (st.read && !st.done) phase = l.task ? 'task' : 'quiz';
    S.lesson = { l, phase, i: 0, quiz: null, wrong: 0, picked: null };
    if (phase === 'quiz') S.lesson.quiz = buildQuiz(l);
    $('#page').hidden = false;
    renderLesson();
  }
  function closePage() {
    S.lesson = null;
    $('#page').hidden = true;
    $('#pageBody').innerHTML = '';
    render();
  }
  function renderLesson() {
    const L = S.lesson;
    if (!L) return;
    const l = L.l;
    const total = l.cards.length + (l.task ? 1 : 0) + l.quiz.length;
    let pos, body, foot;
    if (L.phase === 'cards') {
      const c = l.cards[L.i];
      pos = L.i + 1;
      body = '<div class="card"><small>第 ' + l.id + ' 關　' + esc(l.title) + '</small><h2>' + esc(c.h) + '</h2><p>' + rich(c.p) + '</p>' + (c.fig ? '<div class="fig">' + FIG[c.fig] + '</div>' : '') + '</div>';
      foot = (L.i > 0 ? '<button class="btn quiet" data-act="lprev">上一頁</button>' : '') + '<button class="btn solid" data-act="lnext">' + (L.i === l.cards.length - 1 ? (lessonDone(l.id) ? '完成' : l.task ? '看任務' : '開始測驗') : '下一頁') + '</button>';
    } else if (L.phase === 'task') {
      pos = l.cards.length + 1;
      const done = !!state.flags[l.task.flag];
      let form = '';
      if (l.task.form === 'rules') {
        const cur = state.rules || { risk: 0.02, day: 0.05, rr: 2 };
        const sel = (id, label, arr, val, f) => '<div class="field"><label for="' + id + '"><span>' + label + '</span></label><select id="' + id + '">' + arr.map((v) => '<option value="' + v + '"' + (Math.abs(v - val) < 1e-9 ? ' selected' : '') + '>' + f(v) + '</option>').join('') + '</select></div>';
        form = sel('rRisk', '每筆最多賠掉總資產的', [0.01, 0.02, 0.03], cur.risk, (v) => v * 100 + '%') + sel('rDay', '一天最多賠掉總資產的', [0.03, 0.05, 0.08], cur.day, (v) => v * 100 + '%') + sel('rRr', '盈虧比最低要', [1.5, 2, 3], cur.rr, (v) => v) + '<div class="cta"><button class="btn" data-act="saveRules">' + (done ? '更新我的規則' : '訂下我的規則') + '</button></div>';
      }
      body = '<div class="card"><small>第 ' + l.id + ' 關　任務</small><h2>' + (done ? '任務完成' : '動手做一次') + '</h2><p>' + esc(l.task.text) + '</p>' + form + (done ? '' : l.task.form ? '' : '<p style="margin-top:18px;font-size:14px;color:var(--muted)">完成後回到這一關，就可以開始測驗。</p>') + '</div>';
      foot = done ? '<button class="btn solid" data-act="lquiz">開始測驗</button>' : l.task.form ? '' : '<button class="btn solid" data-act="ltrade">去交易頁</button>';
    } else if (L.phase === 'quiz') {
      const q = L.quiz[L.i];
      pos = l.cards.length + (l.task ? 1 : 0) + L.i + 1;
      const picked = L.picked;
      body = '<div class="card"><small>測驗　' + (L.i + 1) + ' / ' + L.quiz.length + '</small><h2 style="font-size:20px;line-height:1.6">' + esc(q.q) + '</h2><div class="opts">' + q.opts.map((o, i) => '<button class="opt' + (picked != null ? (o.ok ? ' right' : i === picked ? ' wrong' : '') : '') + '" data-act="pick" data-id="' + i + '"' + (picked != null ? ' disabled' : '') + '>' + esc(o.t) + '</button>').join('') + '</div>' + (picked != null ? '<p class="why"><b>' + (q.opts[picked].ok ? '答對了。' : '答錯了。') + '</b>' + esc(q.why) + '</p>' : '') + '</div>';
      foot = picked != null ? '<button class="btn solid" data-act="qnext">' + (L.i === L.quiz.length - 1 ? '看結果' : '下一題') + '</button>' : '';
    } else {
      pos = total;
      const pass = L.wrong === 0;
      const ns = pass ? nextStep() : null;
      body = '<div class="card"><small>第 ' + l.id + ' 關</small><h2>' + (pass ? '過關' : '答錯 ' + L.wrong + ' 題') + '</h2><p>' + (pass ? (ns && ns.lesson ? '下一關是「' + esc(LESSONS.find((x) => x.id === ns.lesson).title) + '」。' : '到「學習」頁看看升段的條件還差什麼。') : '全部答對才算過關。題目裡的價格會換成當下的行情，再試一次。') + '</p></div>';
      foot = pass ? '<button class="btn solid" data-act="ldone">好</button>' : '<button class="btn quiet" data-act="lreview">重看內容</button><button class="btn solid" data-act="lretry">再測一次</button>';
    }
    $('#pageBar').style.width = Math.round((pos / total) * 100) + '%';
    $('#pageBody').innerHTML = body;
    $('#pageFoot').innerHTML = foot;
    $('#pageFoot').hidden = !foot;
    $('#pageBody').scrollTop = 0;
  }
  function lessonAct(act, id) {
    const L = S.lesson;
    if (!L) return;
    const l = L.l;
    const mark = (k) => { state.lessons[l.id] = Object.assign({ read: false, done: false }, state.lessons[l.id], k); save(); };
    if (act === 'lprev') L.i = Math.max(0, L.i - 1);
    else if (act === 'lnext') {
      if (L.i < l.cards.length - 1) L.i++;
      else if (lessonDone(l.id)) return closePage();
      else { mark({ read: true }); L.i = 0; if (l.task) L.phase = 'task'; else { L.phase = 'quiz'; L.quiz = buildQuiz(l); L.wrong = 0; L.picked = null; } }
    } else if (act === 'ltrade') { closePage(); return go('trade'); }
    else if (act === 'lquiz' || act === 'lretry') { L.phase = 'quiz'; L.i = 0; L.quiz = buildQuiz(l); L.wrong = 0; L.picked = null; }
    else if (act === 'lreview') { L.phase = 'cards'; L.i = 0; }
    else if (act === 'pick') { if (L.picked != null) return; L.picked = id; if (!L.quiz[L.i].opts[id].ok) L.wrong++; }
    else if (act === 'qnext') {
      if (L.i < L.quiz.length - 1) { L.i++; L.picked = null; }
      else { L.phase = 'end'; if (L.wrong === 0) mark({ read: true, done: true }); }
    } else if (act === 'ldone') { closePage(); return go('learn'); }
    else if (act === 'saveRules') {
      const risk = parseFloat($('#rRisk').value), day = parseFloat($('#rDay').value), rr = parseFloat($('#rRr').value);
      if (![0.01, 0.02, 0.03].includes(risk) || ![0.03, 0.05, 0.08].includes(day) || ![1.5, 2, 3].includes(rr)) return;
      state.rules = { risk, day, rr };
      state.flags.rules = true;
      save();
      toast('規則已儲存');
    }
    renderLesson();
  }
  function openGloss() {
    S.lesson = null;
    $('#page').hidden = false;
    $('#pageBar').style.width = '0%';
    $('#pageBody').innerHTML = '<div style="padding-top:8px"><h2>名詞小辭典</h2><dl class="gl">' + Object.keys(GLOSSARY).map((k) => '<dt>' + esc(k) + '</dt><dd>' + esc(GLOSSARY[k]) + '</dd>').join('') + '</dl></div>';
    $('#pageFoot').innerHTML = '';
    $('#pageFoot').hidden = true;
  }

  function onAct(act, idRaw, el) {
    const id = /^-?\d+(\.\d+)?$/.test(idRaw || '') ? parseFloat(idRaw) : idRaw;
    switch (act) {
      case 'x': return closeSheet();
      case 'go': return go(id);
      case 'sym':
        if (!E.RANKS[state.rank].syms.includes(id)) return toast(id + ' 要到段位 3 才會解鎖');
        state.settings.sym = id; S.off = 0; save(); render(); return loadChart();
      case 'iv':
        state.settings.interval = id; S.off = 0; state.flags.interval = true; save(); render(); return loadChart();
      case 'ma': state.settings.ma = !state.settings.ma; save(); return render();
      case 'order': return openOrder(id);
      case 'kind': readOrder(); S.form.kind = id; S.form.err = ''; S.form.wkey = null; return renderOrder();
      case 'lev': readOrder(); S.form.lev = id; S.form.wkey = null; return renderOrder();
      case 'reason': S.form.reason = id; $$('#reasons button').forEach((b) => b.classList.toggle('on', b.dataset.id === id)); return;
      case 'qamt': case 'qlimit': case 'qsl': case 'qtp': return fillQuick(act, id);
      case 'submit': return submitOrder();
      case 'close': return openClose(id);
      case 'doClose': return doClose();
      case 'stops': return openStops(id);
      case 'ssl': case 'stp': {
        const p = state.positions.find((x) => x.id === S.form.stopId);
        if (!p) return;
        const px = S.prices[p.sym], long = p.side === 'long';
        if (act === 'ssl') $('#sSl').value = raw(px * (1 + (long ? -id : id) / 100));
        else $('#sTp').value = raw(px * (1 + (long ? id : -id) / 100));
        return;
      }
      case 'saveStops': return saveStops();
      case 'cancel': { const r = E.cancelOrder(state, id); if (r.ok) { save(); render(); toast('掛單已取消，資金已退回'); } return; }
      case 'lesson': if (S.sheetKind) closeSheet(); return openLesson(id);
      case 'gloss': return openGloss();
      case 'pclose': return closePage();
      case 'term': { const t = el.dataset.t; if (GLOSSARY[t]) showInfo(t, [GLOSSARY[t]]); return; }
      case 'trade': { const t = state.trades.find((x) => x.id === id); if (t) showReview(t, false); return; }
      case 'tw': state.settings.twColors = !state.settings.twColors; save(); return render();
      case 'promote': {
        const r = E.promote(state, Date.now(), S.prices);
        if (!r.ok) return toast(r.err);
        save(); render();
        if (r.graduated) return showInfo('結業', ['你完成了全部段位和條件。', '這代表你有方法、有紀律，而且成績不像是運氣。它不保證真錢會賺。']);
        return showInfo('升上段位 ' + r.rank + '　' + E.RANKS[r.rank].name, ['資金增加 ' + fU(r.added) + ' USDT。', UNLOCK[r.rank] + '。', '資金變大，規則不變：每筆最多賠總資產的 2%。']);
      }
      case 'reset': return openSheet('info', '<h2>清除全部資料？</h2><div class="lines"><p>段位、交易紀錄、課程進度都會刪除，而且無法復原。</p></div><div class="cta"><button class="btn quiet" data-act="x">取消</button><button class="btn solid" data-act="doReset">確定清除</button></div>');
      case 'doReset': {
        const keep = S.everLive;
        state = E.newState(Date.now());
        S.everLive = keep;
        S.queue = [];
        save(); closeSheet(); go('trade'); loadChart();
        return toast('已清除，從頭開始');
      }
      default: return lessonAct(act, id);
    }
  }

  function boot() {
    load();
    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-act]');
      if (!el || el.disabled) return;
      e.preventDefault();
      onAct(el.dataset.act, el.dataset.id, el);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('term')) onAct('term', null, e.target);
      if (e.key === 'Escape' && S.sheetKind) closeSheet();
    });
    document.addEventListener('input', (e) => { if (S.sheetKind === 'order' && e.target.tagName === 'INPUT') { $('#oErr').textContent = ''; calcOrder(); } });
    $('#sheet .backdrop').addEventListener('click', () => closeSheet());
    $$('.tabs a').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); go(a.dataset.v); }));
    $('#rankPill').addEventListener('click', () => go('learn'));
    const h = (location.hash || '').slice(1);
    S.view = ['trade', 'learn', 'stats'].includes(h) ? h : 'trade';
    for (const k of E.ALL) if (state.lastPrices[k] > 0) S.prices[k] = state.lastPrices[k];
    setMode('connecting', false);
    render();
    connect();
    setInterval(() => {
      if (S.mode === 'live' && !S.stale && Date.now() - Live.last > 15000) { setMode('live', true); try { if (Live.ws) Live.ws.close(); } catch (e) { return; } }
    }, 5000);
    setInterval(() => { E.touchDD(state, S.prices); save(); }, 10000);
    const loop = () => {
      if (S.dirty) { S.dirty = false; tickUI(); }
      if (S.chartDirty && S.view === 'trade') { S.chartDirty = false; drawChart(); }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    setInterval(() => { if (S.dirty) { S.dirty = false; tickUI(); } }, 1000);
    window.addEventListener('resize', () => { drawChart(); drawSpark(); });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { S.hiddenAt = Date.now(); save(); }
      else if (S.mode === 'live' && Live.ws && Live.ws.readyState === 1 && S.hiddenAt && Date.now() - S.hiddenAt > 90000) onLiveReady(S.hiddenAt, false);
    });
    window.addEventListener('pagehide', save);
    for (const ev of ['gesturestart', 'gesturechange']) document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
    window.__shidan = { S, get state() { return state; }, E, tick: onTick };
  }
  boot();
})();

</script>
</body>
