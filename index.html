<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src wss://data-stream.binance.vision https://data-api.binance.vision wss://stream.binance.com:9443 https://api.binance.com https://fapi.binance.com wss://fstream.binance.com https://api.coingecko.com https://api.alternative.me https://stablecoins.llama.fi https://api.github.com https://gist.githubusercontent.com https://cryptocurrency.cv https://free-crypto-news.vercel.app; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="搞錢">
<meta name="referrer" content="no-referrer">
<title>搞錢 加密貨幣模擬交易</title>
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">搞錢</div>
    <button class="eqbox" id="eqBox" type="button" data-act="book" aria-label="總資產，點開看持倉"><small>總資產 USDT</small><b id="eqVal">—</b><small id="eqSub"></small></button>
    <div class="top-right">
      <span class="feed" id="feed" data-m="connecting"><i></i><span id="feedTxt">連線中</span></span>
      <button class="pill" id="rankPill" type="button">段位 1 新手</button>
    </div>
  </header>
  <main id="view"></main>
  <nav class="tabs" aria-label="主選單">
    <a href="#trade" data-v="trade">交易</a>
    <a href="#team" data-v="team">團隊</a>
    <a href="#learn" data-v="learn">學習</a>
    <a href="#stats" data-v="stats">成績</a>
  </nav>
  <div class="layer" id="page" hidden>
    <div class="page-top"><span class="sub" id="pageTitle">搞錢</span><button type="button" data-act="pclose">關閉</button></div>
    <div class="bar"><i id="pageBar" style="width:0%"></i></div>
    <div class="page-body" id="pageBody"></div>
    <div class="page-foot" id="pageFoot" hidden></div>
  </div>
  <div class="layer" id="sheet" hidden>
    <div class="backdrop"></div>
    <div class="sheet" id="sheetBody" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" aria-live="polite"></div>
</div>
<script src="js/core/engine.js"></script>
<script src="js/core/team-signals.js"></script>
<script src="js/core/team-learn.js"></script>
<script src="js/core/lessons.js"></script>
<script src="js/app/base.js"></script>
<script src="js/app/sync.js"></script>
<script src="js/app/market.js"></script>
<script src="js/app/trading.js"></script>
<script src="js/app/chart.js"></script>
<script src="js/app/trade-view.js"></script>
<script src="js/app/pages.js"></script>
<script src="js/app/actions.js"></script>
<script src="js/team/state.js"></script>
<script src="js/team/market-data.js"></script>
<script src="js/team/sectors-thesis.js"></script>
<script src="js/team/whale.js"></script>
<script src="js/team/shadow.js"></script>
<script src="js/team/risk.js"></script>
<script src="js/team/replay.js"></script>
<script src="js/team/runtime.js"></script>
<script src="js/team/delegation.js"></script>
<script src="js/team/panels.js"></script>
<script src="js/team/analysis.js"></script>
<script src="js/team/view.js"></script>
<script src="js/main.js"></script>
</body>
</html>
