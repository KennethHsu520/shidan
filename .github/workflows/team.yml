name: 雲端團隊

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: cloud-team
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 檢查幣安連線
        run: |
          curl -s -o /dev/null -w "幣安現貨行情 %{http_code}\n" https://data-api.binance.vision/api/v3/ping || true
          curl -s -o /dev/null -w "幣安期貨 %{http_code}\n" https://fapi.binance.com/fapi/v1/ping || true
      - name: 安裝瀏覽器控制工具
        run: npm install --no-save --no-audit --no-fund playwright-core@1.49.1
      - name: 讓團隊工作 50 分鐘
        run: node tools/runner.mjs
        env:
          GAOQIAN_TOKEN: ${{ secrets.GAOQIAN_TOKEN }}
          RUN_MIN: '50'
      - name: 接著排下一次
        if: always()
        run: |
          if [ -n "$GAOQIAN_TOKEN" ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/team.yml/dispatches" -f ref=main && echo "已排下一次"
          else
            echo "沒有 GAOQIAN_TOKEN，不排下一次"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GAOQIAN_TOKEN: ${{ secrets.GAOQIAN_TOKEN }}
